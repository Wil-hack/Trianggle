<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TriHive - Web Chat & Call</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      overscroll-behavior-y: none;
    }
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* HEADER UTAMA */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #f8fafc;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-icon-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon-header:active {
      transform: scale(0.92);
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 10px 3px 3px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-pill span {
      font-size: 0.8rem;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* VIEWPORT CANVAS GRID */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
      perspective: 900px;
    }
    #viewport:active { cursor: grabbing; }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .honeycomb-grid {
      position: relative;
      padding: 150px;
    }
    .grid-row {
      display: flex;
      align-items: flex-start;
      margin-top: -57px;
      width: max-content;
    }
    .grid-row:first-child { margin-top: 0; }
    .grid-row:nth-child(odd) { margin-left: 0; }
    .grid-row:nth-child(even) { margin-left: 50px; }

    .tile {
      position: relative;
      flex: 0 0 100px;
      width: 100px;
      height: 115px;
      margin: 0;
      cursor: pointer;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      animation: oceanWave 6s ease-in-out infinite alternate;
      animation-delay: calc(var(--col-index, 0) * 0.15s);
    }
    @keyframes oceanWave {
      0% { transform: translateY(0px) rotateX(0deg) scale(1); }
      50% { transform: translateY(-7px) rotateX(4deg) scale(1.01); }
      100% { transform: translateY(3px) rotateX(-3deg) scale(0.99); }
    }
    .tile:active {
      transform: scale(1.1) translateZ(15px) !important;
      z-index: 30;
    }
    .tile-inner {
      width: 100%;
      height: 100%;
      position: relative;
      filter: brightness(0.96);
    }
    .tile-upright .tile-inner {
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }
    .tile-inverted .tile-inner {
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      -webkit-clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    }
    .tile-bg {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #161b26 0%, #0d0f17 50%, #1e2433 100%);
      background-size: 200% 200%;
      animation: colorGlow 8s ease infinite alternate;
      border: 0.5px solid rgba(255, 255, 255, 0.03);
    }
    @keyframes colorGlow {
      0% { background-position: 0% 20%; }
      100% { background-position: 100% 80%; }
    }
    .tile-photo-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .tile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile-photo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(11, 13, 18, 0.8) 100%);
      pointer-events: none;
    }
    .unread-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white; font-size: 0.7rem; font-weight: 800;
      padding: 3px 7px; border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
      z-index: 10; display: none;
      animation: badgePulse 2s infinite ease-in-out;
    }
    @keyframes badgePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* MODAL WINDOW */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 11, 15, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200; display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .card-modal {
      background: rgba(20, 22, 32, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      color: #e2e8f0; width: 90%; max-width: 380px; padding: 24px; text-align: center; position: relative;
    }
    .card-modal h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
    .tab-group { display: flex; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #3b82f6; color: white; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input {
      width: 100%; padding: 11px 14px; background: rgba(13, 14, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; outline: none;
    }
    .btn-file-upload {
      display: block; width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.25); border-radius: 10px; color: #3b82f6;
      text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 10px;
    }
    .upload-preview { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin: 8px auto; display: none; border: 2px solid #3b82f6; }
    .btn-submit { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .close-btn { position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }

    .profile-card {
      background: rgba(20, 22, 32, 0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px;
      width: 85%; max-width: 320px; padding: 28px 24px; text-align: center; position: relative; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }
    .profile-card img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6; margin-bottom: 12px; }
    .btn-ngobrol {
      width: 100%; padding: 12px; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    /* JENDELA CHAT */
    .chat-backdrop { align-items: center; padding: 10px; }
    .chat-card-full {
      width: 96%; max-width: 440px; height: 85vh; max-height: 740px;
      background: #191c24; border: 1.5px solid #2d3342; border-radius: 28px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }
    .chat-header-full {
      padding: 16px 20px; background: #202430; border-bottom: 1px solid #2d3342;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-user-full { display: flex; align-items: center; gap: 12px; }
    .chat-user-full img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #dfb76c; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .btn-icon-call, .btn-icon-video {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; height: 38px;
      border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }
    .btn-icon-video { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

    .chat-body-full {
      flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 14px; background: #14161d; touch-action: pan-y !important;
    }

    /* GELEMBUNG PESAN */
    .msg {
      max-width: 82%; 
      min-width: 78px; 
      padding: 8px 12px 22px 12px; 
      font-size: 0.92rem; 
      line-height: 1.4;
      position: relative; 
      word-break: break-word; 
      cursor: pointer;
    }
    .msg-in {
      background: linear-gradient(145deg, #323846 0%, #202430 100%);
      color: #e2e8f0; align-self: flex-start; border-radius: 20px 20px 20px 6px;
      border: 1.5px solid #2d3342; margin-right: 30px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .msg-out.unread {
      background: linear-gradient(145deg, #1d4ed8 0%, #1e293b 100%);
      color: #ffffff; align-self: flex-end; border-radius: 20px 20px 6px 20px;
      border: 1.8px solid #dfb76c; margin-left: 30px; box-shadow: 0 6px 20px rgba(223, 183, 108, 0.25);
    }
    .msg-out.read {
      background: linear-gradient(145deg, #151b2b 0%, #0f131c 100%);
      color: #94a3b8; align-self: flex-end; border-radius: 20px 20px 6px 20px;
      border: 1.5px solid #2d3342; margin-left: 30px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .msg-time {
      position: absolute; bottom: 4px; right: 10px; font-size: 0.62rem; color: #94a3b8; font-weight: 600;
    }
    .msg-in .msg-time { left: 10px; right: auto; }

    .msg-quote {
      background: rgba(0, 0, 0, 0.25); border-left: 3px solid #dfb76c;
      padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; margin-bottom: 6px; color: #cbd5e1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #reply-preview-container {
      display: none; background: #202430; padding: 8px 14px; border-top: 1px solid #2d3342;
      align-items: center; justify-content: space-between; font-size: 0.82rem;
    }
    #reply-preview-text { color: #dfb76c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .msg-img { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; }

    .btn-play-voice {
      background: linear-gradient(145deg, #dfb76c 0%, #9a7632 100%);
      border: 1px solid #fef08a; color: #1e293b; width: 34px; height: 34px;
      border-radius: 50%; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
    }
    .voice-msg-container { display: flex; align-items: center; gap: 10px; }
    .voice-tag { font-size: 0.85rem; font-weight: 700; color: #dfb76c; }

    /* FOOTER CHAT */
    .chat-footer-full { background: #191c24; border-top: 1px solid #2d3342; display: flex; flex-direction: column; }
    .chat-input-row { padding: 12px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
    .chat-footer-full input {
      flex: 1; min-width: 0; padding: 12px 18px; background: #202430;
      border: 1px solid #2d3342; border-radius: 26px; color: white; outline: none; font-size: 0.92rem;
    }
    .chat-footer-full input:focus { border-color: #dfb76c; }
    .btn-chat-action {
      background: linear-gradient(135deg, #dfb76c 0%, #b48c40 100%); border: none;
      width: 42px; height: 42px; border-radius: 50%; color: #10141d; cursor: pointer;
      display: flex; justify-content: center; align-items: center; flex-shrink: 0;
    }
    .btn-mic, .btn-gallery { background: #202430; border: 1px solid #2d3342; color: #dfb76c; }

    /* PANGGILAN VIDEO FULLSCREEN */
    #call-modal.modal-backdrop {
      background: rgba(0, 0, 0, 0.95);
    }
    .call-card {
      background: transparent;
      border: none;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .video-container {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      background: #000;
      border-radius: 0 !important;
      margin: 0 !important;
      z-index: 5;
      display: none;
    }
    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 6;
    }
    #local-video {
      position: absolute;
      top: 70px;
      right: 16px;
      width: 90px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: #222;
      z-index: 15;
    }
    .btn-flip-camera {
      position: absolute;
      top: 70px;
      left: 16px;
      width: 42px;
      height: 42px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
    }
    .call-overlay-info {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .call-overlay-info * {
      pointer-events: auto;
    }
    .call-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #10b981;
      margin: 0 auto 16px;
    }

    .call-actions { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .btn-accept-call { width: 54px; height: 54px; background: #10b981; border: none; border-radius: 50%; color: white; font-size: 1.2rem; cursor: pointer; }
    .btn-end-call { width: 54px; height: 54px; background: #ef4444; border: none; border-radius: 50%; color: white; font-size: 1.2rem; cursor: pointer; }
    .btn-unmute-audio {
      background: rgba(59, 130, 246, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <svg class="svg-defs">
    <defs>
      <clipPath id="tri-upright-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0.5 0, 1 1, 0 1" />
      </clipPath>
      <clipPath id="tri-inverted-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0 0, 1 0, 0.5 1" />
      </clipPath>
    </defs>
  </svg>

  <header>
    <div class="brand"><span class="brand-title">TriHive</span></div>
    <div class="header-controls">
      <button class="btn-icon-header" onclick="openAddContactModal()" title="Tambah Kontak">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="btn-icon-header" id="enable-notifications-btn" onclick="enablePushNotifications()" title="Notifikasi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
      <div class="user-pill" id="user-pill" style="display: none;" onclick="openEditProfileModal()">
        <img id="current-user-avatar" src="" alt="Avatar">
        <span id="current-user-name">Pengguna</span>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas"><div class="honeycomb-grid" id="grid"></div></div>
  </div>

  <audio id="notif-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="ring-audio" src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3" loop preload="auto"></audio>
  
  <!-- Elemen Audio Terpusat untuk WebView -->
  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- LOGIN MODAL -->
  <div class="modal-backdrop active" id="login-modal">
    <div class="card-modal">
      <h2>Masuk Ke TriHive</h2>
      <p>Aplikasi Chat & Call Mosaik Segitiga</p>
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>
      <div id="form-login">
        <div class="form-group"><label>Username</label><input type="text" id="login-username" placeholder="Username..."></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Password..."></div>
        <button class="btn-submit" onclick="submitLogin()">Masuk</button>
      </div>
      <div id="form-register" style="display: none;">
        <div class="form-group"><label>Username (Huruf Kecil)</label><input type="text" id="reg-username" placeholder="contoh: wildan"></div>
        <div class="form-group"><label>Nama Tampilan</label><input type="text" id="reg-fullname" placeholder="Nama Lengkap..."></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Password..."></div>
        <div class="form-group">
          <label>Foto Profil</label>
          <label for="file-input" class="btn-file-upload">📁 Pilih Foto</label>
          <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'upload-preview')">
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Daftar</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Ubah Profil</h2>
      <p>Username: <strong id="edit-username-id" style="color:#3b82f6;">-</strong></p>
      <div class="form-group"><label>Nama Baru</label><input type="text" id="edit-fullname"></div>
      <div class="form-group">
        <label>Ganti Foto</label>
        <label for="file-edit-input" class="btn-file-upload">📁 Pilih Foto Baru</label>
        <input type="file" id="file-edit-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'edit-upload-preview')">
        <img id="edit-upload-preview" class="upload-preview" alt="Preview">
      </div>
      <button class="btn-submit" onclick="saveProfileChanges()">Simpan</button>
      <button class="btn-submit" style="background:#ef4444; margin-top:8px;" onclick="logout()">Keluar Akun</button>
    </div>
  </div>

  <!-- TAMBAH KONTAK MODAL -->
  <div class="modal-backdrop" id="add-contact-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Tambah Kontak</h2>
      <div class="form-group"><label>Username Teman</label><input type="text" id="add-contact-username" placeholder="Username teman..."></div>
      <button class="btn-submit" onclick="submitAddContact()">Tambahkan</button>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, set, get, update, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
      authDomain: "trihive-857cd.firebaseapp.com",
      databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "trihive-857cd",
      storageBucket: "trihive-857cd.firebasestorage.app",
      messagingSenderId: "434709340496",
      appId: "1:434709340496:web:3e1206dc10679ddc680c55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const VAPID_PUBLIC_KEY = "BBqfPddFnX-9yjuEpZ8u0DArJ_shiQ2tK6wTux8yVOQLvIbiCt3XNN6xBs-7RnD8_pTHQExSLV7mL0MVg5uOPFA";

    window.enablePushNotifications = async function () {
      if (!currentUser) { alert("Login dulu!"); return; }
      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") { alert("Izin notifikasi ditolak."); return; }
        const messaging = getMessaging(app);
        const token = await getToken(messaging, { vapidKey: VAPID_PUBLIC_KEY });
        if (token) {
          await set(ref(db, `push_tokens/${currentUser}/${Date.now()}`), { token, updatedAt: Date.now() });
          alert("Notifikasi aktif!");
        }
      } catch (err) { alert("Gagal aktifkan notifikasi."); }
    };

    let contacts = [];
    let activeContact = null;
    let currentUser = null; 
    let currentDisplayName = "";
    let currentAvatarUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";
    let tempUploadAvatar = "";
    let unreadCounts = {};
    let activeListeners = {};
    let activeStatusListener = null;
    let activeProfileStatusListener = null;
    let typingTimeout = null;
    let replyingTo = null;

    let peerConnection = null;
    let localStream = null;
    let targetUser = null;
    let isVideoCall = false;
    let useFrontCamera = true;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    window.addEventListener('DOMContentLoaded', () => { checkAutoLogin(); });

    function checkAutoLogin() {
      const savedUser = localStorage.getItem('trihive_user');
      const savedName = localStorage.getItem('trihive_name');
      const savedAvatar = localStorage.getItem('trihive_avatar');
      if (savedUser) {
        currentUser = savedUser;
        currentDisplayName = savedName || savedUser;
        currentAvatarUrl = savedAvatar || currentAvatarUrl;
        setUserLoggedIn();
        loadUserContacts();
        listenIncomingCalls();
      }
    }

    function unlockAudio() {
      const a = document.getElementById('notif-audio');
      const r = document.getElementById('ring-audio');
      if (a) { a.play().then(()=>{a.pause();a.currentTime=0;}).catch(()=>{}); }
      if (r) { r.play().then(()=>{r.pause();r.currentTime=0;}).catch(()=>{}); }
    }

    function playNotificationSound() {
      const a = document.getElementById('notif-audio');
      if (a) { a.currentTime = 0; a.play().catch(e => {}); }
    }
    function playRingingSound() {
      const a = document.getElementById('ring-audio');
      if (a) { a.currentTime = 0; a.play().catch(e => {}); }
    }
    function stopRingingSound() {
      const a = document.getElementById('ring-audio');
      if (a) { a.pause(); a.currentTime = 0; }
    }

    // Fungsi untuk memaksa pemutaran audio/video dari remote stream
    window.forcePlayAudio = function() {
      const remoteAudio = document.getElementById('remote-audio');
      const remoteVideo = document.getElementById('remote-video');
      if (remoteAudio && remoteAudio.srcObject) {
        remoteAudio.play().then(() => {
          alert("Suara diaktifkan!");
        }).catch(err => {
          console.log("Gagal putar audio:", err);
        });
      }
      if (remoteVideo && remoteVideo.srcObject) {
        remoteVideo.play().catch(err => {});
      }
    };

    function buildGrid() {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      const sortedContacts = [...contacts].sort((a, b) => a.username.localeCompare(b.username));
      const contactAt = new Map();

      if (sortedContacts.length > 0) {
        const availableSlots = [];
        for (let rr = 0; rr < 12; rr++) {
          for (let cc = 0; cc < 12; cc++) {
            if ((rr + cc) % 2 === 1) availableSlots.push({ r: rr, c: cc });
          }
        }
        availableSlots.sort((a, b) => (a.c !== b.c) ? a.c - b.c : a.r - b.r);
        sortedContacts.forEach((person, i) => {
          if (availableSlots[i]) contactAt.set(`${availableSlots[i].r}-${availableSlots[i].c}`, person);
        });
      }

      for (let r = 0; r < 12; r++) {
        const row = document.createElement('div');
        row.className = 'grid-row';
        for (let c = 0; c < 12; c++) {
          const tile = document.createElement('div');
          const isUpright = (r + c) % 2 === 0;
          tile.className = `tile ${isUpright ? 'tile-upright' : 'tile-inverted'}`;
          tile.style.setProperty('--col-index', c + (r * 0.5));
          const inner = document.createElement('div');
          inner.className = 'tile-inner';

          const person = contactAt.get(`${r}-${c}`);
          if (person && !isUpright) {
            const photoWrapper = document.createElement('div');
            photoWrapper.className = 'tile-photo-wrapper';
            const img = document.createElement('img');
            img.src = person.avatar || currentAvatarUrl;
            img.className = 'tile-photo';
            const overlay = document.createElement('div');
            overlay.className = 'tile-photo-overlay';
            photoWrapper.appendChild(img);
            photoWrapper.appendChild(overlay);
            inner.appendChild(photoWrapper);

            const badge = document.createElement('div');
            badge.className = 'unread-badge';
            const count = unreadCounts[person.username] || 0;
            if (count > 0) { badge.innerText = count; badge.style.display = 'block'; }
            tile.appendChild(badge);
            tile.onclick = () => openProfile(person);
          } else {
            const bg = document.createElement('div');
            bg.className = 'tile-bg';
            inner.appendChild(bg);
          }
          tile.appendChild(inner);
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    let isPanning = false, startX = 0, startY = 0, panX = -100, panY = -100;
    function updateTransform() { canvas.style.transform = `translate3d(${panX}px, ${panY}px, 0)`; }
    updateTransform();
    viewport.addEventListener('mousedown', (e) => { if (!e.target.closest('.modal-backdrop') && !e.target.closest('header')) { isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; } });
    window.addEventListener('mousemove', (e) => { if (isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); } });
    window.addEventListener('mouseup', () => { isPanning = false; });

    window.handleFileUpload = function(e, previewId) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          tempUploadAvatar = evt.target.result;
          const prev = document.getElementById(previewId);
          prev.src = tempUploadAvatar; prev.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    window.switchTab = function(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    window.submitLogin = function() {
      unlockAudio();
      const u = document.getElementById('login-username').value.trim().toLowerCase();
      const p = document.getElementById('login-password').value.trim();
      if (!u || !p) { alert("Isi username & password!"); return; }
      get(ref(db, `users/${u}`)).then(snap => {
        if (snap.exists() && snap.val().password === p) {
          currentUser = u; currentDisplayName = snap.val().displayName || u; currentAvatarUrl = snap.val().avatar || currentAvatarUrl;
          localStorage.setItem('trihive_user', currentUser);
          localStorage.setItem('trihive_name', currentDisplayName);
          localStorage.setItem('trihive_avatar', currentAvatarUrl);
          setUserLoggedIn(); loadUserContacts(); listenIncomingCalls();
        } else { alert("Login gagal!"); }
      });
    }

    window.submitRegister = function() {
      unlockAudio();
      const u = document.getElementById('reg-username').value.trim().toLowerCase();
      const f = document.getElementById('reg-fullname').value.trim() || u;
      const p = document.getElementById('reg-password').value.trim();
      if (!u || !p) { alert("Isi data dengan lengkap!"); return; }
      get(ref(db, `users/${u}`)).then(snap => {
        if (snap.exists()) { alert("Username sudah dipakai."); return; }
        const avatar = tempUploadAvatar || currentAvatarUrl;
        set(ref(db, `users/${u}`), { username: u, displayName: f, password: p, avatar }).then(() => {
          currentUser = u; currentDisplayName = f; currentAvatarUrl = avatar;
          localStorage.setItem('trihive_user', currentUser);
          localStorage.setItem('trihive_name', currentDisplayName);
          localStorage.setItem('trihive_avatar', currentAvatarUrl);
          setUserLoggedIn(); loadUserContacts(); listenIncomingCalls();
        });
      });
    }

    function setUserLoggedIn() {
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('user-pill').style.display = 'flex';
      document.getElementById('current-user-name').innerText = currentDisplayName;
      document.getElementById('current-user-avatar').src = currentAvatarUrl;
      const statusRef = ref(db, `status/${currentUser}`);
      onValue(ref(db, '.info/connected'), (snap) => {
        if (snap.val() === true) {
          onDisconnect(statusRef).set({ isOnline: false, lastSeen: Date.now() });
          set(statusRef, { isOnline: true, lastSeen: Date.now() });
        }
      });
      setInterval(() => { if (currentUser) set(ref(db, `status/${currentUser}/lastSeen`), Date.now()); }, 15000);
    }

    function loadUserContacts() {
      onChildAdded(ref(db, `user_contacts/${currentUser}`), (snap) => {
        const cUser = snap.key;
        get(ref(db, `users/${cUser}`)).then(cSnap => {
          if (cSnap.exists()) {
            const data = cSnap.val();
            if (!contacts.find(c => c.username === cUser)) {
              contacts.push({ username: data.username, name: data.displayName || data.username, avatar: data.avatar });
              buildGrid(); listenIncomingMessages(cUser);
            }
          }
        });
      });
    }

    function listenIncomingMessages(cUser) {
      if (activeListeners[cUser]) return;
      activeListeners[cUser] = true;
      const roomId = [currentUser, cUser].sort().join('_');
      let isInit = true;
      get(ref(db, `chats/${roomId}`)).then(() => { isInit = false; });

      onChildAdded(ref(db, `chats/${roomId}`), (snap) => {
        const data = snap.val();
        if (data.sender === cUser) {
          const isOpen = activeContact && activeContact.username === cUser && document.getElementById('chat-modal').classList.contains('active');
          if (isOpen) {
            update(ref(db, `chats/${roomId}/${snap.key}`), { unread: false });
          } else if (data.unread !== false) {
            if (!isInit) playNotificationSound();
            unreadCounts[cUser] = (unreadCounts[cUser] || 0) + 1;
            buildGrid();
          }
        }
      });

      onChildChanged(ref(db, `chats/${roomId}`), (snap) => {
        const data = snap.val();
        if (data.sender === cUser && data.unread === false) {
          if (unreadCounts[cUser] > 0) { unreadCounts[cUser]--; buildGrid(); }
        }
      });
    }

    function listenIncomingCalls() {
      onValue(ref(db, `calls/${currentUser}`), (snap) => {
        const data = snap.val();
        if (data && data.status === 'calling') {
          targetUser = data.caller;
          isVideoCall = !!data.isVideo;
          playRingingSound();
          document.getElementById('incoming-name').innerText = data.callerName;
          document.getElementById('incoming-avatar').src = data.callerAvatar;
          document.getElementById('incoming-call-type').innerText = isVideoCall ? "Video Call Masuk..." : "Voice Call Masuk...";
          document.getElementById('incoming-call-modal').classList.add('active');
        } else if (data && data.status === 'connected') {
          stopRingingSound();
          document.getElementById('call-status-text').innerText = "Terhubung";
        } else if (!data) {
          stopRingingSound();
          cleanupWebRTC();
          document.getElementById('incoming-call-modal').classList.remove('active');
          document.getElementById('call-modal').classList.remove('active');
        }
      });

      onValue(ref(db, `webrtc_signals/${currentUser}/answer`), async (snap) => {
        const ans = snap.val();
        if (ans && peerConnection && peerConnection.signalingState === "have-local-offer") {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(ans));
          stopRingingSound();
        }
      });

      onChildAdded(ref(db, `webrtc_signals/${currentUser}/candidates`), async (snap) => {
        const cand = snap.val();
        if (cand && peerConnection && peerConnection.remoteDescription) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
        }
      });
    }

    async function initMediaStream(video) {
      try {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
          audio: true,
          video: video ? { facingMode: useFrontCamera ? 'user' : 'environment' } : false
        };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        const localVid = document.getElementById('local-video');
        const videoBox = document.getElementById('video-box');
        const btnFlip = document.getElementById('btn-flip');
        const callAvatar = document.getElementById('call-avatar');

        if (video) {
          localVid.srcObject = localStream;
          videoBox.style.display = 'block';
          btnFlip.style.display = 'flex';
          callAvatar.style.display = 'none';
        } else {
          videoBox.style.display = 'none';
          btnFlip.style.display = 'none';
          callAvatar.style.display = 'block';
        }
      } catch (err) { alert("Gagal akses kamera/mikrofon."); throw err; }
    }

    window.switchCamera = async function() {
      useFrontCamera = !useFrontCamera;
      if (isVideoCall) {
        await initMediaStream(true);
        if (peerConnection) {
          const videoTrack = localStream.getVideoTracks()[0];
          const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) { sender.replaceTrack(videoTrack); }
        }
      }
    };

    function createPeerConnection(remoteUser) {
      if (peerConnection) return;
      targetUser = remoteUser;
      peerConnection = new RTCPeerConnection(rtcConfig);
      
      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
      
      // Mengaitkan event ontrack ke elemen audio dan video dengan pemutaran paksa otomatis
      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remote-audio');
        const remoteVideo = document.getElementById('remote-video');
        
        if (event.streams && event.streams[0]) {
          const stream = event.streams[0];
          if (remoteVideo) {
            remoteVideo.srcObject = stream;
            remoteVideo.play().catch(e => console.log("Gagal autoplay video:", e));
          }
          if (remoteAudio) {
            remoteAudio.srcObject = stream;
            remoteAudio.play().catch(e => console.log("Gagal autoplay audio:", e));
          }
        } else {
          // Fallback jika stream tidak langsung terikat
          let inboundStream = new MediaStream();
          inboundStream.addTrack(event.track);
          if (event.track.kind === 'video' && remoteVideo) {
            remoteVideo.srcObject = inboundStream;
            remoteVideo.play().catch(e => {});
          } else if (event.track.kind === 'audio' && remoteAudio) {
            remoteAudio.srcObject = inboundStream;
            remoteAudio.play().catch(e => {});
          }
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && targetUser) {
          push(ref(db, `webrtc_signals/${targetUser}/candidates`), event.candidate.toJSON());
        }
      };
    }

    window.startCall = async function(video) {
      if (!activeContact) return;
      isVideoCall = video;
      try { await initMediaStream(video); } catch (e) { return; }
      
      if (video) {
        document.getElementById('video-box').style.display = 'block';
        document.getElementById('btn-flip').style.display = 'flex';
      }

      playRingingSound();
      remove(ref(db, `webrtc_signals/${activeContact.username}`));
      remove(ref(db, `webrtc_signals/${currentUser}`));
      createPeerConnection(activeContact.username);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      set(ref(db, `calls/${activeContact.username}`), {
        caller: currentUser, callerName: currentDisplayName, callerAvatar: currentAvatarUrl, status: 'calling', isVideo: isVideoCall
      });
      set(ref(db, `webrtc_signals/${activeContact.username}/offer`), { type: offer.type, sdp: offer.sdp });

      document.getElementById('call-name').innerText = activeContact.name;
      document.getElementById('call-avatar').src = activeContact.avatar;
      document.getElementById('call-status-text').innerText = "Memanggil...";
      document.getElementById('call-modal').classList.add('active');
    }

    window.acceptCall = async function() {
      stopRingingSound();
      document.getElementById('incoming-call-modal').classList.remove('active');
      
      if (isVideoCall) {
        document.getElementById('video-box').style.display = 'block';
        document.getElementById('btn-flip').style.display = 'flex';
      }

      try { await initMediaStream(isVideoCall); } catch (e) { return; }
      createPeerConnection(targetUser);

      const offerSnap = await get(ref(db, `webrtc_signals/${currentUser}/offer`));
      if (offerSnap.exists()) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        set(ref(db, `webrtc_signals/${targetUser}/answer`), { type: answer.type, sdp: answer.sdp });
      }
      await update(ref(db, `calls/${currentUser}`), { status: 'connected' });
      await update(ref(db, `calls/${targetUser}`), { status: 'connected' });
      document.getElementById('call-status-text').innerText = "Terhubung";
      document.getElementById('call-modal').classList.add('active');
    }

    window.rejectCall = function() {
      stopRingingSound();
      if (targetUser) { remove(ref(db, `calls/${targetUser}`)); remove(ref(db, `webrtc_signals/${targetUser}`)); }
      remove(ref(db, `calls/${currentUser}`)); remove(ref(db, `webrtc_signals/${currentUser}`));
      document.getElementById('incoming-call-modal').classList.remove('active');
    }

    function cleanupWebRTC() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      const remoteAudio = document.getElementById('remote-audio');
      const remoteVideo = document.getElementById('remote-video');
      if (remoteAudio) remoteAudio.srcObject = null;
      if (remoteVideo) remoteVideo.srcObject = null;
      document.getElementById('video-box').style.display = 'none';
      document.getElementById('btn-flip').style.display = 'none';
      targetUser = null;
    }

    window.endCall = function() {
      stopRingingSound();
      if (targetUser) { remove(ref(db, `calls/${targetUser}`)); remove(ref(db, `webrtc_signals/${targetUser}`)); }
      if (activeContact) { remove(ref(db, `calls/${activeContact.username}`)); remove(ref(db, `webrtc_signals/${activeContact.username}`)); }
      remove(ref(db, `calls/${currentUser}`)); remove(ref(db, `webrtc_signals/${currentUser}`));
      cleanupWebRTC();
      document.getElementById('call-modal').classList.remove('active');
    }

    window.toggleVoiceRecord = async function() {
      const micBtn = document.getElementById('btn-mic');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const reader = new FileReader();
            reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
            reader.onloadend = () => { sendVoiceMessage(reader.result); };
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start(); isRecording = true; micBtn.style.color = '#ef4444';
        } catch (e) { alert("Mikrofon gagal diakses."); }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        isRecording = false; micBtn.style.color = '#dfb76c';
      }
    }

    function sendVoiceMessage(base64Audio) {
      if (!activeContact) return;
      const roomId = [currentUser, activeContact.username].sort().join('_');
      push(ref(db, `chats/${roomId}`), {
        sender: currentUser, type: 'voice', audio: base64Audio, unread: true, timestamp: Date.now(),
        replyTo: replyingTo ? { text: replyingTo.text || 'Pesan Suara', sender: replyingTo.sender } : null
      });
      cancelReply();
    }

    window.sendImageMessage = function(e) {
      const file = e.target.files[0];
      if (!file || !activeContact) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const roomId = [currentUser, activeContact.username].sort().join('_');
        push(ref(db, `chats/${roomId}`), {
          sender: currentUser, type: 'image', image: evt.target.result, unread: true, timestamp: Date.now(),
          replyTo: replyingTo ? { text: replyingTo.text || 'Gambar', sender: replyingTo.sender } : null
        });
        cancelReply();
      };
      reader.readAsDataURL(file);
    }

    window.openEditProfileModal = function() {
      document.getElementById('edit-username-id').innerText = `@${currentUser}`;
      document.getElementById('edit-fullname').value = currentDisplayName;
      document.getElementById('edit-upload-preview').src = currentAvatarUrl;
      document.getElementById('edit-upload-preview').style.display = 'block';
      document.getElementById('edit-profile-modal').classList.add('active');
    }

    window.saveProfileChanges = function() {
      const name = document.getElementById('edit-fullname').value.trim();
      const avatar = tempUploadAvatar || currentAvatarUrl;
      if (!name) return;
      update(ref(db, `users/${currentUser}`), { displayName: name, avatar }).then(() => {
        currentDisplayName = name; currentAvatarUrl = avatar;
        localStorage.setItem('trihive_name', currentDisplayName);
        localStorage.setItem('trihive_avatar', currentAvatarUrl);
        document.getElementById('current-user-name').innerText = currentDisplayName;
        document.getElementById('current-user-avatar').src = currentAvatarUrl;
        tempUploadAvatar = ""; closeModals();
      });
    }

    window.openAddContactModal = function() { if (currentUser) document.getElementById('add-contact-modal').classList.add('active'); }
    window.submitAddContact = function() {
      const u = document.getElementById('add-contact-username').value.trim().toLowerCase();
      if (!u || u === currentUser) { alert("Username tidak valid."); return; }
      get(ref(db, `users/${u}`)).then(snap => {
        if (!snap.exists()) { alert("Username tidak ditemukan."); return; }
        set(ref(db, `user_contacts/${currentUser}/${u}`), true);
        set(ref(db, `user_contacts/${u}/${currentUser}`), true);
        document.getElementById('add-contact-username').value = '';
        closeModals(); alert("Kontak ditambahkan!");
      });
    }

    window.logout = function() {
      if (currentUser) set(ref(db, `status/${currentUser}`), { isOnline: false, lastSeen: Date.now() });
      localStorage.clear(); currentUser = null; contacts = []; unreadCounts = {}; activeListeners = {};
      buildGrid(); document.getElementById('user-pill').style.display = 'none';
      closeModals(); document.getElementById('login-modal').classList.add('active');
    }

    window.openProfile = function(person) {
      activeContact = person;
      document.getElementById('preview-name').innerText = person.name;
      document.getElementById('preview-username-id').innerText = `@${person.username}`;
      document.getElementById('preview-avatar').src = person.avatar;
      const statusElem = document.getElementById('preview-status');
      if (activeProfileStatusListener) activeProfileStatusListener();
      activeProfileStatusListener = onValue(ref(db, `status/${person.username}`), (snap) => {
        const d = snap.val();
        statusElem.innerText = (d && d.isOnline) ? "● Online" : "● Offline";
        statusElem.style.color = (d && d.isOnline) ? "#10b981" : "#94a3b8";
      });
      document.getElementById('profile-modal').classList.add('active');
    }

    window.openChat = function() {
      closeModals();
      document.getElementById('chat-name').innerText = activeContact.name;
      document.getElementById('chat-avatar').src = activeContact.avatar;
      document.getElementById('chat-modal').classList.add('active');
      unreadCounts[activeContact.username] = 0; buildGrid();

      const statusElem = document.getElementById('chat-status');
      if (activeStatusListener) activeStatusListener();
      activeStatusListener = onValue(ref(db, `status/${activeContact.username}`), (snap) => {
        const d = snap.val();
        if (d && d.isTyping) { statusElem.innerText = "Sedang mengetik..."; statusElem.style.color = "#dfb76c"; }
        else if (d && d.isOnline) { statusElem.innerText = "Online"; statusElem.style.color = "#10b981"; }
        else { statusElem.innerText = "Offline"; statusElem.style.color = "#94a3b8"; }
      });
      loadMessages();
    }

    window.notifyTyping = function() {
      if (!currentUser || !activeContact) return;
      const statusRef = ref(db, `status/${currentUser}`);
      update(statusRef, { isOnline: true, isTyping: true });
      if (typingTimeout) clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { update(statusRef, { isTyping: false }); }, 2000);
    };

    function loadMessages() {
      const chatBody = document.getElementById('chat-body');
      chatBody.innerHTML = '';
      const roomId = [currentUser, activeContact.username].sort().join('_');

      onChildAdded(ref(db, `chats/${roomId}`), (snap) => {
        const data = snap.val();
        const msgKey = snap.key;
        if (!data || (data.type === 'text' && (!data.text || data.text === 'undefined'))) return;

        const isMe = data.sender === currentUser;
        if (!isMe && data.unread !== false) update(ref(db, `chats/${roomId}/${msgKey}`), { unread: false });

        let msgDiv = document.getElementById(`msg-${msgKey}`);
        if (!msgDiv) { msgDiv = document.createElement('div'); msgDiv.id = `msg-${msgKey}`; chatBody.appendChild(msgDiv); }

        let readClass = isMe ? ((data.unread === false) ? 'read' : 'unread') : '';
        msgDiv.className = `msg ${isMe ? 'msg-out ' + readClass : 'msg-in'}`;

        let replyHtml = data.replyTo ? `<div class="msg-quote"><strong>${data.replyTo.sender === currentUser ? 'Anda' : activeContact.name}</strong>: ${data.replyTo.text}</div>` : '';
        let contentHtml = '';
        if (data.type === 'voice') {
          contentHtml = `<div class="voice-msg-container"><button class="btn-play-voice" onclick="playVoice(this, '${data.audio}')">▶</button><span class="voice-tag">Pesan Suara</span></div>`;
        } else if (data.type === 'image') {
          contentHtml = `<img src="${data.image}" class="msg-img" alt="Foto">`;
        } else {
          contentHtml = `<span>${data.text}</span>`;
        }

        const timeString = new Date(data.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const timeHtml = `<span class="msg-time">${timeString}</span>`;

        msgDiv.innerHTML = replyHtml + contentHtml + timeHtml;
        msgDiv.onclick = () => setReply(data.text || (data.type === 'voice' ? 'Pesan Suara' : 'Gambar'), data.sender);
        chatBody.scrollTop = chatBody.scrollHeight;
      });

      onChildChanged(ref(db, `chats/${roomId}`), (snap) => {
        const data = snap.val();
        const msgDiv = document.getElementById(`msg-${snap.key}`);
        if (msgDiv && data.sender === currentUser && data.unread === false) {
          msgDiv.classList.remove('unread'); msgDiv.classList.add('read');
        }
      });
    }

    window.setReply = function(text, sender) {
      replyingTo = { text, sender };
      document.getElementById('reply-preview-container').style.display = 'flex';
      document.getElementById('reply-preview-text').innerText = `Membalas ${sender === currentUser ? 'Anda' : activeContact.name}: "${text}"`;
      document.getElementById('chat-input').focus();
    }
    window.cancelReply = function() { replyingTo = null; document.getElementById('reply-preview-container').style.display = 'none'; }
    window.playVoice = function(btn, base64) {
      const audio = new Audio(base64);
      btn.innerText = "⏸"; audio.play(); audio.onended = () => { btn.innerText = "▶"; };
    }
    window.sendMsg = function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeContact) return;
      const roomId = [currentUser, activeContact.username].sort().join('_');
      push(ref(db, `chats/${roomId}`), {
        sender: currentUser, type: 'text', text, unread: true, timestamp: Date.now(),
        replyTo: replyingTo ? { text: replyingTo.text, sender: replyingTo.sender } : null
      });
      input.value = ''; if (typingTimeout) clearTimeout(typingTimeout);
      update(ref(db, `status/${currentUser}`), { isTyping: false });
      cancelReply();
    }
    window.handleKey = function(e) { if (e.key === 'Enter') window.sendMsg(); }
    window.closeModals = function() { document.querySelectorAll('.modal-backdrop').forEach(m => { if (m.id !== 'login-modal') m.classList.remove('active'); }); }

    buildGrid();
  </script>
</body>
</html>
