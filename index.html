<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriHive</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Gaya Tampilan & Animasi Standar */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; margin: 0; padding: 15px; box-sizing: border-box; }
        .app-container { max-width: 450px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        h2 { text-align: center; color: #25D366; margin-bottom: 20px; }
        .card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; transition: all 0.3s ease; }
        .card:hover { background: #333333; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 15px; }
        input { background: #3a3a3a; color: white; border: 1px solid #555; }
        button { background: #25D366; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:active { transform: scale(0.98); }
        button.danger { background: #e53935; margin-top: 5px; }
        #call-status { font-weight: bold; color: #ffeb3b; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>TriHive</h2>
        
        <div class="card">
            <p>ID Saya: <b id="my-peer-id" style="color: #25D366;">Menghubungkan...</b></p>
        </div>

        <div class="card">
            <label style="font-size: 13px; color: #aaa;">ID Teman / Tujuan:</label>
            <input type="text" id="target-id" placeholder="Masukkan ID teman...">
            <button onclick="startCall()">Panggil Suara</button>
            <button class="danger" onclick="hangUpCall()">Akhiri Panggilan</button>
        </div>

        <div id="call-status">Status: Siap menelepon</div>
    </div>

    <!-- Elemen Audio untuk Suara Panggilan Masuk/Keluar -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        let localAudioStream;
        let activeCall;

        // INISIALISASI PEERJS DENGAN STUN SERVER GOOGLE (Mencegah putus saat dijawab)
        const peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            document.getElementById('my-peer-id').innerText = id;
        });

        // Menangani Panggilan Masuk
        peer.on('call', async (incomingCall) => {
            document.getElementById('call-status').innerText = 'Status: Ada panggilan masuk...';
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                incomingCall.answer(localAudioStream);
                activeCall = incomingCall;

                document.getElementById('call-status').innerText = 'Status: Terhubung (Panggilan Aktif)';

                incomingCall.on('stream', (remoteStream) => {
                    document.getElementById('remote-audio').srcObject = remoteStream;
                });

                incomingCall.on('close', () => {
                    document.getElementById('call-status').innerText = 'Status: Panggilan Ditutup';
                    cleanupAudio();
                });
            } catch (err) {
                alert('Gagal mengakses mikrofon: ' + err.message);
            }
        });

        // Melakukan Panggilan Keluar
        async function startCall() {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return alert('Masukkan ID teman terlebih dahulu!');

            document.getElementById('call-status').innerText = 'Status: Memanggil...';
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const call = peer.call(targetId, localAudioStream);
                activeCall = call;

                call.on('stream', (remoteStream) => {
                    document.getElementById('call-status').innerText = 'Status: Terhubung (Panggilan Aktif)';
                    document.getElementById('remote-audio').srcObject = remoteStream;
                });

                call.on('close', () => {
                    document.getElementById('call-status').innerText = 'Status: Panggilan Ditutup';
                    cleanupAudio();
                });
            } catch (err) {
                alert('Gagal mengakses mikrofon: ' + err.message);
            }
        }

        // Mematikan / Mengakhiri Panggilan
        function hangUpCall() {
            if (activeCall) {
                activeCall.close();
            }
            cleanupAudio();
            document.getElementById('call-status').innerText = 'Status: Panggilan dihentikan';
        }

        function cleanupAudio() {
            if (localAudioStream) {
                localAudioStream.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
