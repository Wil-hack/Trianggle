<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TriHive - Web Chat & Voice/Video Call</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      overscroll-behavior-y: none;
    }
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* HEADER UTAMA */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(11, 13, 18, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      color: #f8fafc;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-add-contact {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #3b82f6;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-pill span {
      font-size: 0.85rem;
    }

    /* VIEWPORT CANVAS KANVAS GESER */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
      perspective: 900px;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .honeycomb-grid {
      position: relative;
      padding: 80px;
    }
    .grid-row {
      display: flex;
      margin-top: -36px;
    }
    .grid-row:nth-child(odd) { margin-left: 24px; }
    .grid-row:nth-child(even) { margin-left: 68px; }

    .tile {
      position: relative;
      width: 100px;
      height: 115px;
      margin: 0 4px;
      cursor: pointer;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      animation: oceanWave 6s ease-in-out infinite alternate;
      animation-delay: calc(var(--col-index, 0) * 0.15s);
    }

    @keyframes oceanWave {
      0% { transform: translateY(0px) rotateX(0deg) scale(1); }
      50% { transform: translateY(-7px) rotateX(4deg) scale(1.01); }
      100% { transform: translateY(3px) rotateX(-3deg) scale(0.99); }
    }

    .tile:active {
      transform: scale(1.1) translateZ(15px) !important;
      z-index: 30;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      position: relative;
      filter: brightness(0.96);
    }
    .tile-upright .tile-inner { clip-path: url(#tri-upright-clip); }
    .tile-inverted .tile-inner { clip-path: url(#tri-inverted-clip); }
    
    .tile-bg {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #181c28 0%, #0d0f17 50%, #22293e 100%);
      background-size: 200% 200%;
      animation: colorGlow 8s ease infinite alternate;
    }
    @keyframes colorGlow {
      0% { background-position: 0% 20%; }
      100% { background-position: 100% 80%; }
    }

    .tile-photo-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .tile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile-photo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(11, 13, 18, 0.8) 100%);
      pointer-events: none;
    }

    .unread-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
      z-index: 10;
      display: none;
    }

    /* MODAL WINDOW NATIVE ANTI-MACET */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 11, 15, 0.95);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }
    .modal-backdrop.active {
      display: flex !important;
    }

    .card-modal {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      color: #e2e8f0;
      width: 90%;
      max-width: 380px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .card-modal h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
    
    .tab-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active { background: #3b82f6; color: white; }

    .form-group { margin-bottom: 14px; text-align: left; position: relative; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .form-group input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: #0a0c10;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 8px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px 8px;
    }

    .btn-file-upload {
      display: block;
      width: 100%;
      padding: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      color: #3b82f6;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .upload-preview {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      margin: 8px auto;
      display: none;
      border: 2px solid #3b82f6;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .profile-card {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 85%;
      max-width: 320px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }
    .profile-card img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
      margin-bottom: 12px;
    }
    .btn-ngobrol {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    /* JENDELA CHAT FULL */
    .chat-backdrop {
      align-items: center;
      padding: 10px;
    }
    .chat-card-full {
      width: 96%;
      max-width: 440px;
      height: 85vh;
      max-height: 740px;
      background: #191c24;
      border: 1.5px solid #2d3342;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }

    .chat-header-full {
      padding: 16px 20px;
      background: #202430;
      border-bottom: 1px solid #2d3342;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-user-full {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-user-full img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #dfb76c;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-round-call {
      background: linear-gradient(135deg, #dfb76c 0%, #b48c40 100%);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #10141d;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(223, 183, 108, 0.35);
    }

    .chat-body-full {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #14161d;
    }

    .msg {
      max-width: 85%;
      min-width: 90px;
      padding: 10px 14px 22px 14px;
      font-size: 0.92rem;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }
    .msg-in {
      background: linear-gradient(145deg, #323846 0%, #202430 100%);
      color: #e2e8f0;
      align-self: flex-start;
      border-radius: 16px 16px 16px 4px;
      border: 1.5px solid #dfb76c;
    }
    .msg-out {
      background: linear-gradient(145deg, #252a37 0%, #1a1d26 100%);
      color: #ffffff;
      align-self: flex-end;
      border-radius: 16px 16px 4px 16px;
      border: 1.5px solid rgba(223, 183, 108, 0.4);
    }
    .msg-out.read {
      background: linear-gradient(145deg, #1d4ed8 0%, #1e3a8a 100%);
      border: 1.5px solid #dfb76c;
    }
    .msg-text-content { padding-right: 50px; }
    .msg-footer-info {
      position: absolute;
      bottom: 4px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .msg-status-ticks { font-size: 0.72rem; font-weight: 800; }

    .msg-call-log {
      align-self: center;
      max-width: 90%;
      background: rgba(32, 36, 48, 0.85);
      border: 1.5px solid #dfb76c;
      border-radius: 16px;
      padding: 10px 16px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #e2e8f0;
      cursor: pointer;
    }
    .msg-call-log.missed { border-color: #ef4444; color: #fca5a5; }

    .btn-play-voice {
      background: linear-gradient(145deg, #dfb76c 0%, #9a7632 100%);
      border: 1px solid #fef08a;
      color: #1e293b;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice-msg-container { display: flex; align-items: center; gap: 10px; }
    .voice-tag { font-size: 0.88rem; font-weight: 700; color: #dfb76c; display: flex; align-items: center; gap: 6px; }

    .chat-footer-full {
      padding: 14px 18px;
      background: #191c24;
      border-top: 1px solid #2d3342;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .chat-footer-full input {
      flex: 1;
      min-width: 0;
      padding: 13px 20px;
      background: #202430;
      border: 1px solid #2d3342;
      border-radius: 26px;
      color: white;
      outline: none;
    }
    .btn-chat-action {
      background: linear-gradient(135deg, #dfb76c 0%, #b48c40 100%);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #10141d;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-mic { background: #202430; border: 1px solid #2d3342; color: #dfb76c; }

    /* BOTTOM SHEET */
    .bottom-sheet-backdrop { align-items: flex-end !important; padding: 0 !important; }
    .bottom-sheet-card {
      width: 100%;
      max-width: 500px;
      background: #191c24;
      border-top: 1.5px solid #2d3342;
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 36px;
      color: white;
    }
    .bottom-sheet-drag { width: 42px; height: 4px; background: #475569; border-radius: 2px; margin: 0 auto 16px; }
    .bottom-sheet-title { font-size: 0.88rem; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; }
    .bottom-sheet-option {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #202430;
      border: 1px solid #2d3342;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .bottom-sheet-option .opt-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(223, 183, 108, 0.15); border: 1px solid #dfb76c;
      display: flex; align-items: center; justify-content: center; color: #dfb76c;
    }

    /* OVERLAYS TELEPON */
    .call-card-full {
      width: 100vw; height: 100vh; background: #0b0d12;
      display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px; position: relative;
    }
    #remote-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
    #local-video { position: absolute; top: 24px; right: 20px; width: 110px; height: 155px; object-fit: cover; border-radius: 16px; border: 2px solid #dfb76c; z-index: 10; display: none; }
    .call-ui-layer { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .call-avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 4px solid #10b981; margin: 0 auto 20px; }
    .call-actions { display: flex; justify-content: center; gap: 20px; margin-top: 25px; z-index: 10; }
    .btn-accept-call { width: 58px; height: 58px; background: #10b981; border: none; border-radius: 50%; color: white; font-size: 1.25rem; cursor: pointer; }
    .btn-end-call { width: 58px; height: 58px; background: #ef4444; border: none; border-radius: 50%; color: white; font-size: 1.25rem; cursor: pointer; }
  </style>
</head>
<body>

  <svg class="svg-defs">
    <defs>
      <clipPath id="tri-upright-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0.5 0, 1 1, 0 1" />
      </clipPath>
      <clipPath id="tri-inverted-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0 0, 1 0, 0.5 1" />
      </clipPath>
    </defs>
  </svg>

  <header>
    <div class="brand"><span class="brand-title">TriHive</span></div>
    <div class="header-controls">
      <button class="btn-add-contact" onclick="openAddContactModal()">+ Kontak</button>
      <div class="user-pill" id="user-pill" style="display: none;" onclick="openEditProfileModal()">
        <img id="current-user-avatar" src="" alt="Avatar">
        <span id="current-user-name">Pengguna</span>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas">
      <div class="honeycomb-grid" id="grid"></div>
    </div>
  </div>

  <audio id="notif-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="ring-audio" src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3" loop preload="auto"></audio>
  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- LOGIN MODAL -->
  <div class="modal-backdrop active" id="login-modal">
    <div class="card-modal">
      <h2>Masuk Ke TriHive</h2>
      <p>Aplikasi Chat & Telepon Mosaik Segitiga</p>
      
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <div id="form-login">
        <div class="form-group">
          <label>Username Unik</label>
          <input type="text" id="login-username" placeholder="Masukkan username...">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="Masukkan password...">
            <button type="button" class="btn-toggle-pwd" onclick="togglePwd('login-password', this)">👁️</button>
          </div>
        </div>
        <button class="btn-submit" onclick="submitLogin()">Masuk</button>
      </div>

      <div id="form-register" style="display: none;">
        <div class="form-group">
          <label>Username Unik</label>
          <input type="text" id="reg-username" placeholder="Contoh: wildan">
        </div>
        <div class="form-group">
          <label>Nama Tampilan</label>
          <input type="text" id="reg-fullname" placeholder="Contoh: Wildan Jaka">
        </div>
        <div class="form-group">
          <label>Password Akun</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" placeholder="Buat password...">
            <button type="button" class="btn-toggle-pwd" onclick="togglePwd('reg-password', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label>Foto Profil</label>
          <label for="file-input" class="btn-file-upload">📁 Pilih Foto dari HP</label>
          <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'upload-preview')">
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Daftar Akun Baru</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Ubah Profil</h2>
      <p>ID: <strong id="edit-username-id" style="color:#3b82f6;">-</strong></p>
      <div class="form-group">
        <label>Nama Baru</label>
        <input type="text" id="edit-fullname" placeholder="Nama baru...">
      </div>
      <div class="form-group">
        <label>Ganti Foto</label>
        <label for="file-edit-input" class="btn-file-upload">📁 Pilih Foto Baru</label>
        <input type="file" id="file-edit-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'edit-upload-preview')">
        <img id="edit-upload-preview" class="upload-preview" alt="Preview">
      </div>
      <button class="btn-submit" onclick="saveProfileChanges()">Simpan</button>
      <button class="btn-submit" style="background:#ef4444; margin-top:8px;" onclick="logout()">Keluar Akun</button>
    </div>
  </div>

  <!-- TAMBAH KONTAK MODAL -->
  <div class="modal-backdrop" id="add-contact-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Tambah Kontak</h2>
      <div class="form-group">
        <label>Username Teman</label>
        <input type="text" id="add-contact-username" placeholder="Username teman...">
      </div>
      <button class="btn-submit" onclick="submitAddContact()">+ Tambahkan</button>
    </div>
  </div>

  <!-- PROFILE PREVIEW MODAL -->
  <div class="modal-backdrop" id="profile-modal">
    <div class="profile-card">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <img id="preview-avatar" src="" alt="Avatar">
      <h3 id="preview-name" style="margin-bottom: 2px; font-size:1.2rem;">Nama</h3>
      <p id="preview-username-id" style="color: #94a3b8; font-size: 0.75rem; margin-bottom: 6px;">@username</p>
      <p id="preview-status" style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">● Offline</p>
      <button class="btn-ngobrol" onclick="openChat()">Ngobrol</button>
    </div>
  </div>

  <!-- CHAT MODAL -->
  <div class="modal-backdrop chat-backdrop" id="chat-modal">
    <div class="chat-card-full">
      <div class="chat-header-full">
        <div class="chat-user-full">
          <img id="chat-avatar" src="" alt="Avatar">
          <div>
            <h4 id="chat-name" style="color:white; font-size:0.95rem; font-weight:600;">Nama</h4>
            <span id="chat-status" style="color:#94a3b8; font-size:0.75rem;">Offline</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-round-call" onclick="openCallOptionSheet()">📞</button>
          <button class="close-btn" style="position:static;" onclick="closeModals()">✕</button>
        </div>
      </div>
      <div class="chat-body-full" id="chat-body"></div>
      <div class="chat-footer-full">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeypress="handleKey(event)">
        <button class="btn-chat-action btn-mic" id="btn-mic" onclick="toggleVoiceRecord()" title="Rekam Suara">🎙️</button>
        <button class="btn-chat-action" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET CALL -->
  <div class="modal-backdrop bottom-sheet-backdrop" id="call-sheet-modal" onclick="closeCallSheet(event)">
    <div class="bottom-sheet-card">
      <div class="bottom-sheet-drag"></div>
      <div class="bottom-sheet-title">Pilih tipe panggilan</div>
      <div class="bottom-sheet-option" onclick="startCall('voice')">
        <div class="opt-icon">📞</div>
        <div><div style="font-weight: 600;">Panggilan suara</div></div>
      </div>
      <div class="bottom-sheet-option" onclick="startCall('video')">
        <div class="opt-icon">📹</div>
        <div><div style="font-weight: 600;">Panggilan video</div></div>
      </div>
    </div>
  </div>

  <!-- OVERLAYS CALL -->
  <div class="modal-backdrop" id="call-modal">
    <div class="call-card-full">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
      <div class="call-ui-layer">
        <img class="call-avatar" id="call-avatar" src="" alt="Avatar">
        <h3 id="call-name" style="color:white;">Nama</h3>
        <p id="call-status-text" style="color: #10b981;">Memanggil...</p>
      </div>
      <div class="call-actions">
        <button class="btn-end-call" onclick="endCall()">✕</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="incoming-call-modal">
    <div class="card-modal">
      <img class="call-avatar" id="incoming-avatar" src="" alt="Avatar">
      <h3 id="incoming-name" style="color:white;">Nama</h3>
      <p id="incoming-call-type-text" style="color: #3b82f6;">Panggilan Masuk...</p>
      <div class="call-actions">
        <button class="btn-accept-call" onclick="acceptCall()">📞</button>
        <button class="btn-end-call" onclick="rejectCall()">✕</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE & FITUR LENGKAP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, set, get, update, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
      authDomain: "trihive-857cd.firebaseapp.com",
      databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "trihive-857cd",
      storageBucket: "trihive-857cd.firebasestorage.app",
      messagingSenderId: "434709340496",
      appId: "1:434709340496:web:3e1206dc10679ddc680c55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let contacts = [];
    let activeContact = null;
    let currentUser = null; 
    let currentDisplayName = "";
    let currentAvatarUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";
    let tempUploadAvatar = "";
    let unreadCounts = {};
    let activeListeners = {};
    let activeStatusListener = null;
    let activeProfileStatusListener = null;

    let peerConnection = null;
    let localStream = null;
    let targetUser = null;
    let pendingCandidates = [];
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentCallType = 'voice'; 
    let callStartTime = null;

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.togglePwd = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    };

    window.switchTab = function(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    };

    window.handleFileUpload = function(e, previewId) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempUploadAvatar = evt.target.result;
          const preview = document.getElementById(previewId);
          preview.src = tempUploadAvatar;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    };

    window.submitLogin = function() {
      const u = document.getElementById('login-username').value.trim().toLowerCase();
      const p = document.getElementById('login-password').value.trim();
      if (!u || !p) return alert("Isi username & password!");

      get(ref(db, `users/${u}`)).then(snap => {
        if (!snap.exists()) return alert("User tidak ditemukan!");
        const dat = snap.val();
        if (dat.password !== p) return alert("Password salah!");
        
        currentUser = u;
        currentDisplayName = dat.displayName || u;
        currentAvatarUrl = dat.avatar || currentAvatarUrl;
        saveAndStart();
      });
    };

    window.submitRegister = function() {
      const u = document.getElementById('reg-username').value.trim().toLowerCase();
      const n = document.getElementById('reg-fullname').value.trim() || u;
      const p = document.getElementById('reg-password').value.trim();
      if (!u || !p) return alert("Isi username & password!");

      get(ref(db, `users/${u}`)).then(snap => {
        if (snap.exists()) return alert("Username sudah dipakai!");
        const avatar = tempUploadAvatar || currentAvatarUrl;
        set(ref(db, `users/${u}`), { username: u, displayName: n, password: p, avatar }).then(() => {
          currentUser = u; currentDisplayName = n; currentAvatarUrl = avatar;
          saveAndStart();
        });
      });
    };

    function saveAndStart() {
      localStorage.setItem('trihive_user', currentUser);
      localStorage.setItem('trihive_name', currentDisplayName);
      localStorage.setItem('trihive_avatar', currentAvatarUrl);
      setUserLoggedIn();
      loadUserContacts();
      listenIncomingCalls();
    }

    function setUserLoggedIn() {
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('user-pill').style.display = 'flex';
      document.getElementById('current-user-name').innerText = currentDisplayName;
      document.getElementById('current-user-avatar').src = currentAvatarUrl;
    }

    const savedUser = localStorage.getItem('trihive_user');
    if (savedUser) {
      currentUser = savedUser;
      currentDisplayName = localStorage.getItem('trihive_name') || savedUser;
      currentAvatarUrl = localStorage.getItem('trihive_avatar') || currentAvatarUrl;
      setUserLoggedIn();
      loadUserContacts();
      listenIncomingCalls();
    }

    function loadUserContacts() {
      onChildAdded(ref(db, `user_contacts/${currentUser}`), snap => {
        const cUser = snap.key;
        get(ref(db, `users/${cUser}`)).then(cSnap => {
          if (cSnap.exists()) {
            const d = cSnap.val();
            if (!contacts.find(x => x.username === cUser)) {
              contacts.push({ username: d.username, name: d.displayName || d.username, avatar: d.avatar });
              buildGrid();
            }
          }
        });
      });
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const totalRows = 6, totalCols = 8;
      let slots = [];
      for(let r=0; r<totalRows; r++){
        for(let c=0; c<totalCols; c++){
          if((r+c)%2 !== 0) slots.push({r, c});
        }
      }
      let slotMap = {};
      contacts.forEach((p, idx) => {
        if(idx < slots.length) slotMap[`${slots[idx].r}-${slots[idx].c}`] = p;
      });

      for(let r=0; r<totalRows; r++){
        const row = document.createElement('div');
        row.className = 'grid-row';
        for(let c=0; c<totalCols; c++){
          const tile = document.createElement('div');
          const isUp = (r+c)%2 === 0;
          tile.className = `tile ${isUp ? 'tile-upright' : 'tile-inverted'}`;
          const inner = document.createElement('div');
          inner.className = 'tile-inner';
          const p = slotMap[`${r}-${c}`];
          if(!isUp && p){
            const pw = document.createElement('div');
            pw.className = 'tile-photo-wrapper';
            pw.innerHTML = `<img src="${p.avatar || currentAvatarUrl}" class="tile-photo"><div class="tile-photo-overlay"></div>`;
            inner.appendChild(pw);
            tile.onclick = () => openProfile(p);
          } else {
            inner.innerHTML = `<div class="tile-bg"></div>`;
          }
          tile.appendChild(inner);
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    window.openProfile = function(p) {
      activeContact = p;
      document.getElementById('preview-name').innerText = p.name;
      document.getElementById('preview-username-id').innerText = `@${p.username}`;
      document.getElementById('preview-avatar').src = p.avatar;
      document.getElementById('profile-modal').classList.add('active');
    };

    window.openChat = function() {
      closeModals();
      document.getElementById('chat-name').innerText = activeContact.name;
      document.getElementById('chat-avatar').src = activeContact.avatar;
      document.getElementById('chat-modal').classList.add('active');
      loadMessages();
    };

    window.closeModals = function() {
      document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active'));
    };

    function getRoomId(a, b) { return [a, b].sort().join('_'); }

    window.sendMsg = function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if(!text || !activeContact) return;
      push(ref(db, `chats/${getRoomId(currentUser, activeContact.username)}`), {
        sender: currentUser, type: 'text', text, unread: true, timestamp: Date.now()
      });
      input.value = '';
    };

    function loadMessages() {
      const chatBody = document.getElementById('chat-body');
      chatBody.innerHTML = '';
      onChildAdded(ref(db, `chats/${getRoomId(currentUser, activeContact.username)}`), snap => {
        const d = snap.val();
        const div = document.createElement('div');
        div.className = `msg ${d.sender === currentUser ? 'msg-out' : 'msg-in'}`;
        div.innerHTML = `<div class="msg-text-content">${d.text}</div>`;
        chatBody.appendChild(div);
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    window.openAddContactModal = () => document.getElementById('add-contact-modal').classList.add('active');
    window.submitAddContact = () => {
      const u = document.getElementById('add-contact-username').value.trim().toLowerCase();
      if(!u) return;
      get(ref(db, `users/${u}`)).then(snap => {
        if(!snap.exists()) return alert("User tidak ada!");
        set(ref(db, `user_contacts/${currentUser}/${u}`), true);
        set(ref(db, `user_contacts/${u}/${currentUser}`), true);
        alert("Kontak ditambahkan!");
        closeModals();
      });
    };

    window.openEditProfileModal = () => {
      document.getElementById('edit-username-id').innerText = `@${currentUser}`;
      document.getElementById('edit-fullname').value = currentDisplayName;
      document.getElementById('edit-profile-modal').classList.add('active');
    };

    window.saveProfileChanges = () => {
      const n = document.getElementById('edit-fullname').value.trim();
      const a = tempUploadAvatar || currentAvatarUrl;
      update(ref(db, `users/${currentUser}`), { displayName: n, avatar: a }).then(() => {
        currentDisplayName = n; currentAvatarUrl = a;
        localStorage.setItem('trihive_name', n); localStorage.setItem('trihive_avatar', a);
        setUserLoggedIn(); closeModals();
      });
    };

    window.logout = () => { localStorage.clear(); location.reload(); };

    buildGrid();
  </script>
</body>
</html>
