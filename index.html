<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TriHive - Web Chat & Voice Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0d12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #e2e8f0; overscroll-behavior-y: none; touch-action: pan-x pan-y; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

    header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(11, 13, 18, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 100; }
    .brand-title { font-weight: 700; font-size: 1.15rem; letter-spacing: 1.5px; text-transform: lowercase; color: #f8fafc; }
    .header-controls { display: flex; align-items: center; gap: 10px; }
    .btn-add-contact { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); color: #3b82f6; padding: 6px 12px; border-radius: 18px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .user-pill { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; }
    .user-pill img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .user-pill span { font-size: 0.85rem; }

    #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; touch-action: none; perspective: 900px; }
    #viewport:active { cursor: grabbing; }
    #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .honeycomb-grid { position: relative; padding: 150px; }
    .grid-row { display: flex; margin-top: -36px; }
    .grid-row:nth-child(odd) { margin-left: 24px; }
    .grid-row:nth-child(even) { margin-left: 68px; }

    .tile { position: relative; width: 100px; height: 115px; margin: 0 4px; cursor: pointer; will-change: transform; transform: translateZ(0); backface-visibility: hidden; animation: oceanWave 6s ease-in-out infinite alternate; animation-delay: calc(var(--col-index, 0) * 0.15s); }
    @keyframes oceanWave { 0% { transform: translateY(0px) rotateX(0deg) scale(1); } 50% { transform: translateY(-7px) rotateX(4deg) scale(1.01); } 100% { transform: translateY(3px) rotateX(-3deg) scale(0.99); } }
    .tile:active { transform: scale(1.1) translateZ(15px) !important; z-index: 30; }

    .tile-inner { width: 100%; height: 100%; position: relative; filter: brightness(0.96); }
    .tile-upright .tile-inner { clip-path: url(#tri-upright-clip); }
    .tile-inverted .tile-inner { clip-path: url(#tri-inverted-clip); }
    
    .tile-bg { width: 100%; height: 100%; background: linear-gradient(135deg, #181c28 0%, #0d0f17 50%, #22293e 100%); background-size: 200% 200%; animation: colorGlow 8s ease infinite alternate; }
    @keyframes colorGlow { 0% { background-position: 0% 20%; } 100% { background-position: 100% 80%; } }

    .tile-photo-wrapper { position: relative; width: 100%; height: 100%; }
    .tile-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile-photo-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(11, 13, 18, 0.8) 100%); pointer-events: none; }

    .unread-badge { position: absolute; top: 6px; right: 6px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; font-size: 0.7rem; font-weight: 800; padding: 3px 7px; border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6); z-index: 10; display: none; animation: badgePulse 2s infinite ease-in-out; }
    @keyframes badgePulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 11, 15, 0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 200; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; touch-action: auto; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .card-modal { background: rgba(20, 22, 32, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); color: #e2e8f0; width: 90%; max-width: 380px; padding: 24px; text-align: center; position: relative; }
    .card-modal h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
    
    .tab-group { display: flex; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #3b82f6; color: white; }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input { width: 100%; padding: 11px 14px; background: rgba(13, 14, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; outline: none; }
    .btn-file-upload { display: block; width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.06); border: 1px dashed rgba(255, 255, 255, 0.25); border-radius: 10px; color: #3b82f6; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .upload-preview { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin: 8px auto; display: none; border: 2px solid #3b82f6; }
    .btn-submit { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .close-btn { position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }

    .profile-card { background: rgba(20, 22, 32, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; width: 85%; max-width: 320px; padding: 28px 24px; text-align: center; position: relative; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); }
    .profile-card img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6; margin-bottom: 12px; }
    .btn-ngobrol { width: 100%; padding: 12px; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); transition: transform 0.15s; }
    .btn-ngobrol:active { transform: scale(0.96); }

    .chat-backdrop { align-items: center; padding: 10px; }
    .chat-card-full { width: 96%; max-width: 440px; height: 85vh; max-height: 740px; background: rgba(14, 16, 23, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); }
    .chat-header-full { padding: 14px 18px; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: space-between; }
    .chat-user-full { display: flex; align-items: center; gap: 12px; }
    .chat-user-full img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #10b981; }
    .header-actions { display: flex; align-items: center; gap: 12px; }

    .btn-icon-call { background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: 1px solid rgba(255, 255, 255, 0.15); width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); transition: transform 0.15s ease; }
    .btn-icon-call:active { transform: scale(0.92); }

    .chat-body-full { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; touch-action: pan-y; }

    .msg { max-width: 80%; padding: 11px 15px; border-radius: 18px; font-size: 0.9rem; line-height: 1.45; position: relative; word-break: break-word; }
    .msg-in { background: rgba(255, 255, 255, 0.07); color: #f8fafc; align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
    .msg-out { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; align-self: flex-end; border-top-right-radius: 4px; padding-bottom: 22px; padding-right: 36px; border: 1px solid rgba(255, 255, 255, 0.22); border-top: 1.5px solid rgba(255, 255, 255, 0.35); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.4); }
    .msg-status { position: absolute; bottom: 4px; right: 10px; font-size: 0.68rem; color: rgba(255, 255, 255, 0.65); letter-spacing: -1.5px; font-weight: 700; }
    .msg-status.read { color: #38bdf8; }

    .chat-footer-full { padding: 12px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: rgba(10, 11, 15, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 10px; align-items: center; }
    .chat-footer-full input { flex: 1; min-width: 0; padding: 12px 18px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 26px; color: white; outline: none; font-size: 0.9rem; }
    .chat-footer-full input:focus { border-color: rgba(59, 130, 246, 0.5); background: rgba(255, 255, 255, 0.09); }

    .btn-chat-action { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border: none; width: 44px; height: 44px; border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45); transition: transform 0.15s ease; }
    .btn-chat-action:active { transform: scale(0.92); }
    .btn-mic { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14); color: #94a3b8; box-shadow: none; }

    .call-card { background: rgba(20, 22, 32, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 26px; width: 85%; max-width: 320px; padding: 40px 24px; text-align: center; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); }
    .call-avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 4px solid #10b981; margin: 0 auto 20px; }
    .call-actions { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
    .btn-accept-call { width: 58px; height: 58px; background: #10b981; border: none; border-radius: 50%; color: white; font-size: 1.25rem; cursor: pointer; box-shadow: 0 8px 22px rgba(16, 185, 129, 0.5); }
    .btn-end-call { width: 58px; height: 58px; background: #ef4444; border: none; border-radius: 50%; color: white; font-size: 1.25rem; cursor: pointer; box-shadow: 0 8px 22px rgba(239, 68, 68, 0.5); }
  </style>
</head>
<body>

  <svg class="svg-defs">
    <defs>
      <clipPath id="tri-upright-clip" clipPathUnits="objectBoundingBox"><polygon points="0.5 0, 1 1, 0 1" /></clipPath>
      <clipPath id="tri-inverted-clip" clipPathUnits="objectBoundingBox"><polygon points="0 0, 1 0, 0.5 1" /></clipPath>
    </defs>
  </svg>

  <header>
    <div class="brand"><span class="brand-title">trihive</span></div>
    <div class="header-controls">
      <button class="btn-add-contact" onclick="openAddContactModal()">+ Kontak</button>
      <div class="user-pill" id="user-pill" style="display: none;" onclick="openEditProfileModal()">
        <img id="current-user-avatar" src="" alt="Avatar">
        <span id="current-user-name">Pengguna</span>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas">
      <div class="honeycomb-grid" id="grid"></div>
    </div>
  </div>

  <audio id="notif-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="ring-audio" src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3" loop preload="auto"></audio>
  <audio id="remote-audio" autoplay playsinline></audio>

  <div class="modal-backdrop active" id="login-modal">
    <div class="card-modal">
      <h2>Masuk Ke TriHive</h2>
      <p>Aplikasi Chat & Telepon Mosaik Segitiga</p>
      
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <div id="form-login">
        <div class="form-group"><label>Username Unik</label><input type="text" id="login-username" placeholder="Masukkan username..."></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Masukkan password..."></div>
        <button class="btn-submit" onclick="submitLogin()">Masuk</button>
      </div>

      <div id="form-register" style="display: none;">
        <div class="form-group"><label>Username Unik</label><input type="text" id="reg-username" placeholder="Contoh: wildan"></div>
        <div class="form-group"><label>Nama Tampilan</label><input type="text" id="reg-fullname" placeholder="Contoh: Wildan Jaka"></div>
        <div class="form-group"><label>Password Akun</label><input type="password" id="reg-password" placeholder="Buat password..."></div>
        <div class="form-group">
          <label>Foto Profil</label>
          <label for="file-input" class="btn-file-upload">📁 Pilih Foto</label>
          <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'upload-preview')">
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Daftar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Ubah Profil</h2>
      <p>ID Username: <strong id="edit-username-id" style="color:#3b82f6;">-</strong></p>
      <div class="form-group"><label>Nama Baru</label><input type="text" id="edit-fullname"></div>
      <div class="form-group">
        <label>Foto Baru</label>
        <label for="file-edit-input" class="btn-file-upload">📁 Pilih Foto Baru</label>
        <input type="file" id="file-edit-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'edit-upload-preview')">
        <img id="edit-upload-preview" class="upload-preview" alt="Preview">
      </div>
      <button class="btn-submit" onclick="saveProfileChanges()">Simpan</button>
      <button class="btn-submit" style="background:#ef4444; margin-top:8px;" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="modal-backdrop" id="add-contact-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Tambah Kontak</h2>
      <div class="form-group"><label>Username Teman</label><input type="text" id="add-contact-username"></div>
      <button class="btn-submit" onclick="submitAddContact()">+ Tambahkan</button>
    </div>
  </div>

  <div class="modal-backdrop" id="profile-modal">
    <div class="profile-card">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <img id="preview-avatar" src="" alt="Avatar">
      <h3 id="preview-name">Nama Kontak</h3>
      <p id="preview-username-id">@username</p>
      <p id="preview-status">● Offline</p>
      <button class="btn-ngobrol" onclick="openChat()">Ngobrol</button>
    </div>
  </div>

  <div class="modal-backdrop chat-backdrop" id="chat-modal">
    <div class="chat-card-full">
      <div class="chat-header-full">
        <div class="chat-user-full">
          <img id="chat-avatar" src="" alt="Avatar">
          <div><h4 id="chat-name">Nama Kontak</h4><span id="chat-status">Offline</span></div>
        </div>
        <div class="header-actions">
          <button class="btn-icon-call" onclick="startCall()" title="Panggil Suara">📞</button>
          <button class="close-btn" style="position:static;" onclick="closeModals()">✕</button>
        </div>
      </div>
      <div class="chat-body-full" id="chat-body"></div>
      <div class="chat-footer-full">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeypress="handleKey(event)">
        <button class="btn-chat-action btn-mic" id="btn-mic" onclick="toggleVoiceRecord()">🎤</button>
        <button class="btn-chat-action" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="call-modal">
    <div class="call-card">
      <img class="call-avatar" id="call-avatar" src="" alt="Avatar">
      <h3 id="call-name">Nama Kontak</h3>
      <p id="call-status-text" style="color: #10b981;">Memanggil...</p>
      <div class="call-actions">
        <button class="btn-end-call" onclick="endCall()">✕</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="incoming-call-modal">
    <div class="call-card">
      <img class="call-avatar" id="incoming-avatar" src="" alt="Avatar">
      <h3 id="incoming-name">Nama Kontak</h3>
      <p style="color: #3b82f6;">Panggilan Suara Masuk...</p>
      <div class="call-actions">
        <button class="btn-accept-call" onclick="acceptCall()">📞</button>
        <button class="btn-end-call" onclick="rejectCall()">✕</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, set, get, update, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
      authDomain: "trihive-857cd.firebaseapp.com",
      databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "trihive-857cd",
      storageBucket: "trihive-857cd.firebasestorage.app",
      messagingSenderId: "434709340496",
      appId: "1:434709340496:web:3e1206dc10679ddc680c55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let contacts = [];
    let activeContact = null;
    let currentUser = null; 
    let currentDisplayName = "";
    let currentAvatarUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";
    let tempUploadAvatar = "";
    let unreadCounts = {};
    let activeListeners = {};

    let peerConnection = null;
    let localStream = null;
    let targetUser = null;
    let pendingCandidates = []; // BUFFER UNTUK MENCEGAH KONEKSI DROPPED

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' }
      ]
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => {});
      }
      checkAutoLogin();
    });

    function checkAutoLogin() {
      const savedUser = localStorage.getItem('trihive_user');
      if (savedUser) {
        currentUser = savedUser;
        currentDisplayName = localStorage.getItem('trihive_name') || savedUser;
        currentAvatarUrl = localStorage.getItem('trihive_avatar') || currentAvatarUrl;
        setUserLoggedIn();
        loadUserContacts();
        listenIncomingCalls();
      }
    }

    function playRingingSound() { const a = document.getElementById('ring-audio'); if (a) { a.currentTime = 0; a.play().catch(() => {}); } }
    function stopRingingSound() { const a = document.getElementById('ring-audio'); if (a) { a.pause(); a.currentTime = 0; } }

    function listenIncomingCalls() {
      const callsRef = ref(db, `calls/${currentUser}`);
      onValue(callsRef, (snapshot) => {
        const callData = snapshot.val();
        if (callData && callData.status === 'calling') {
          targetUser = callData.caller;
          playRingingSound();
          document.getElementById('incoming-name').innerText = callData.callerName;
          document.getElementById('incoming-avatar').src = callData.callerAvatar;
          document.getElementById('incoming-call-modal').classList.add('active');
        } else if (callData && callData.status === 'connected') {
          stopRingingSound();
          document.getElementById('call-status-text').innerText = "Terhubung (Suara Live)";
        } else if (!callData) {
          stopRingingSound();
          cleanupWebRTC();
          document.getElementById('incoming-call-modal').classList.remove('active');
          document.getElementById('call-modal').classList.remove('active');
        }
      });

      // LISTENER ANSWER
      const answerRef = ref(db, `webrtc_signals/${currentUser}/answer`);
      onValue(answerRef, async (snapshot) => {
        const answer = snapshot.val();
        if (answer && peerConnection && peerConnection.signalingState === "have-local-offer") {
          try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            document.getElementById('call-status-text').innerText = "Terhubung (Suara Live)";
            stopRingingSound();
            processPendingCandidates();
          } catch (e) { console.log("Answer error:", e); }
        }
      });

      // LISTENER CANDIDATES
      const candRef = ref(db, `webrtc_signals/${currentUser}/candidates`);
      onChildAdded(candRef, async (snapshot) => {
        const candidate = snapshot.val();
        if (candidate) {
          if (peerConnection && peerConnection.remoteDescription) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
          } else {
            pendingCandidates.push(candidate);
          }
        }
      });
    }

    async function processPendingCandidates() {
      if (peerConnection && peerConnection.remoteDescription) {
        while (pendingCandidates.length > 0) {
          const cand = pendingCandidates.shift();
          try { await peerConnection.addIceCandidate(new RTCIceCandidate(cand)); } catch(e){}
        }
      }
    }

    async function initLocalAudio() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      }
    }

    function createPeerConnection(remoteUsername) {
      if (peerConnection) return;
      targetUser = remoteUsername;
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remote-audio');
        if (remoteAudio && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(() => {});
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && targetUser) {
          push(ref(db, `webrtc_signals/${targetUser}/candidates`), event.candidate.toJSON());
        }
      };
    }

    window.startCall = async function() {
      if (!activeContact) return;
      const remoteUsername = activeContact.username;
      try { await initLocalAudio(); } catch (e) { return; }

      playRingingSound();
      remove(ref(db, `webrtc_signals/${remoteUsername}`));
      remove(ref(db, `webrtc_signals/${currentUser}`));
      
      createPeerConnection(remoteUsername);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      set(ref(db, `calls/${remoteUsername}`), {
        caller: currentUser, callerName: currentDisplayName, callerAvatar: currentAvatarUrl, status: 'calling'
      });

      set(ref(db, `webrtc_signals/${remoteUsername}/offer`), { type: offer.type, sdp: offer.sdp });

      document.getElementById('call-name').innerText = activeContact.name;
      document.getElementById('call-avatar').src = activeContact.avatar;
      document.getElementById('call-status-text').innerText = "Memanggil...";
      document.getElementById('call-modal').classList.add('active');
    }

    window.acceptCall = async function() {
      stopRingingSound();
      document.getElementById('incoming-call-modal').classList.remove('active');

      try { await initLocalAudio(); } catch (e) { return; }

      const callerUsername = targetUser;
      createPeerConnection(callerUsername);

      const offerSnap = await get(ref(db, `webrtc_signals/${currentUser}/offer`));
      if (offerSnap.exists()) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        set(ref(db, `webrtc_signals/${callerUsername}/answer`), { type: answer.type, sdp: answer.sdp });
        processPendingCandidates();
      }

      await update(ref(db, `calls/${currentUser}`), { status: 'connected' });
      await update(ref(db, `calls/${callerUsername}`), { status: 'connected' });

      document.getElementById('call-name').innerText = document.getElementById('incoming-name').innerText;
      document.getElementById('call-avatar').src = document.getElementById('incoming-avatar').src;
      document.getElementById('call-status-text').innerText = "Terhubung (Suara Live)";
      document.getElementById('call-modal').classList.add('active');
    }

    window.rejectCall = function() {
      stopRingingSound();
      if (targetUser) { remove(ref(db, `calls/${targetUser}`)); remove(ref(db, `webrtc_signals/${targetUser}`)); }
      remove(ref(db, `calls/${currentUser}`)); remove(ref(db, `webrtc_signals/${currentUser}`));
      document.getElementById('incoming-call-modal').classList.remove('active');
    }

    function cleanupWebRTC() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
      const remoteAudio = document.getElementById('remote-audio');
      if (remoteAudio) remoteAudio.srcObject = null;
      targetUser = null;
      pendingCandidates = [];
    }

    window.endCall = function() {
      stopRingingSound();
      if (targetUser) { remove(ref(db, `calls/${targetUser}`)); remove(ref(db, `webrtc_signals/${targetUser}`)); }
      if (activeContact) { remove(ref(db, `calls/${activeContact.username}`)); remove(ref(db, `webrtc_signals/${activeContact.username}`)); }
      remove(ref(db, `calls/${currentUser}`)); remove(ref(db, `webrtc_signals/${currentUser}`));
      cleanupWebRTC();
      document.getElementById('call-modal').classList.remove('active');
    }

    function setUserLoggedIn() {
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('user-pill').style.display = 'flex';
      document.getElementById('current-user-name').innerText = currentDisplayName;
      document.getElementById('current-user-avatar').src = currentAvatarUrl;
    }

    function loadUserContacts() {
      onChildAdded(ref(db, `user_contacts/${currentUser}`), (snapshot) => {
        const cUsername = snapshot.key;
        get(ref(db, `users/${cUsername}`)).then((cSnap) => {
          if (cSnap.exists()) {
            contacts.push({ username: cUsername, name: cSnap.val().displayName || cUsername, avatar: cSnap.val().avatar });
            buildGrid();
          }
        });
      });
    }

    function buildGrid() {
      const grid = document.getElementById('grid'); grid.innerHTML = ''; let contactIdx = 0;
      for (let r = 0; r < 8; r++) {
        const row = document.createElement('div'); row.className = 'grid-row';
        for (let c = 0; c < 10; c++) {
          const tile = document.createElement('div'); const isUp = (r + c) % 2 === 0;
          tile.className = `tile ${isUp ? 'tile-upright' : 'tile-inverted'}`;
          const inner = document.createElement('div'); inner.className = 'tile-inner';
          if (!isUp && contactIdx < contacts.length) {
            const p = contacts[contactIdx++];
            inner.innerHTML = `<div class="tile-photo-wrapper"><img src="${p.avatar}" class="tile-photo"></div>`;
            tile.onclick = () => openProfile(p);
          } else { inner.innerHTML = '<div class="tile-bg"></div>'; }
          tile.appendChild(inner); row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    window.openProfile = function(person) {
      activeContact = person;
      document.getElementById('preview-name').innerText = person.name;
      document.getElementById('preview-username-id').innerText = `@${person.username}`;
      document.getElementById('preview-avatar').src = person.avatar;
      document.getElementById('profile-modal').classList.add('active');
    }

    window.openChat = function() {
      document.getElementById('profile-modal').classList.remove('active');
      document.getElementById('chat-name').innerText = activeContact.name;
      document.getElementById('chat-avatar').src = activeContact.avatar;
      document.getElementById('chat-modal').classList.add('active');
    }

    window.closeModals = function() { document.querySelectorAll('.modal-backdrop').forEach(m => { if (m.id !== 'login-modal') m.classList.remove('active'); }); }
  </script>
</body>
</html>
