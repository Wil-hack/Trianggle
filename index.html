<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TriHive - Web Chat & Voice Call</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e12;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
    }
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(13, 14, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: lowercase;
      color: #f8fafc;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-add-contact {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #3b82f6;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-pill span {
      font-size: 0.85rem;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .honeycomb-grid {
      position: relative;
      padding: 150px;
    }
    .grid-row {
      display: flex;
      margin-top: -36px;
    }
    
    /* Variasi margin acak natural antar baris */
    .grid-row:nth-child(odd) { margin-left: 24px; }
    .grid-row:nth-child(even) { margin-left: 68px; }
    .grid-row:nth-child(3n) { margin-left: 12px; }
    .grid-row:nth-child(5n) { margin-left: 52px; }

    .tile {
      position: relative;
      width: 100px;
      height: 115px;
      margin: 0 4px;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .tile:active {
      transform: scale(1.12);
      z-index: 20;
    }
    .tile-inner {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .tile-upright .tile-inner {
      clip-path: url(#tri-upright-clip);
    }
    .tile-inverted .tile-inner {
      clip-path: url(#tri-inverted-clip);
    }
    .tile-bg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #181a22 0%, #0f1016 100%);
      border: 1px solid rgba(255,255,255,0.02);
    }
    .tile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .unread-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid #0d0e12;
      z-index: 10;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 11, 15, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      touch-action: auto;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card-modal {
      background: rgba(22, 24, 34, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      color: #e2e8f0;
      width: 90%;
      max-width: 380px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .card-modal h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
    
    .tab-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active { background: #3b82f6; color: white; }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(13, 14, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    .btn-file-upload {
      display: block;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #3b82f6;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .upload-preview {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      margin: 8px auto;
      display: none;
      border: 2px solid #3b82f6;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .profile-card {
      background: rgba(22, 24, 34, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      width: 85%;
      max-width: 320px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
    }
    .profile-card img {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
      margin-bottom: 12px;
    }
    .btn-ngobrol {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
      transition: transform 0.2s;
    }

    .chat-backdrop {
      align-items: center;
      padding: 10px;
    }
    .chat-card-full {
      width: 96%;
      max-width: 440px;
      height: 84vh;
      max-height: 720px;
      background: rgba(16, 18, 26, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }
    .chat-header-full {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-user-full {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-user-full img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3b82f6;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-icon-call {
      background: #10b981;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }
    .chat-body-full {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      touch-action: pan-y;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.4;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      position: relative;
      word-break: break-word;
    }
    .msg-in {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .msg-out {
      background: #3b82f6;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      padding-bottom: 22px;
    }
    .msg-status {
      position: absolute;
      bottom: 4px;
      right: 12px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: -1px;
    }
    .chat-footer-full {
      padding: 12px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: rgba(10, 11, 15, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-footer-full input {
      flex: 1;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      color: white;
      outline: none;
      font-size: 0.88rem;
    }
    .chat-footer-full button {
      background: #3b82f6;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .call-card {
      background: rgba(22, 24, 34, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 85%;
      max-width: 320px;
      padding: 40px 24px;
      text-align: center;
    }
    .call-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #10b981;
      margin: 0 auto 20px;
    }
    .btn-end-call {
      width: 56px;
      height: 56px;
      background: #ef4444;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <svg class="svg-defs">
    <defs>
      <clipPath id="tri-upright-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0.5 0, 1 1, 0 1" />
      </clipPath>
      <clipPath id="tri-inverted-clip" clipPathUnits="objectBoundingBox">
        <polygon points="0 0, 1 0, 0.5 1" />
      </clipPath>
    </defs>
  </svg>

  <header>
    <div class="brand">
      <span class="brand-title">trihive</span>
    </div>
    <div class="header-controls">
      <button class="btn-add-contact" onclick="openAddContactModal()">+ Kontak</button>
      <div class="user-pill" id="user-pill" style="display: none;" onclick="openEditProfileModal()">
        <img id="current-user-avatar" src="" alt="Avatar">
        <span id="current-user-name">Pengguna</span>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas">
      <div class="honeycomb-grid" id="grid"></div>
    </div>
  </div>

  <!-- LOGIN / REGISTER MODAL -->
  <div class="modal-backdrop active" id="login-modal">
    <div class="card-modal">
      <h2>Masuk Ke TriHive</h2>
      <p>Aplikasi Chat & Telepon Mosaik Segitiga</p>
      
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- FORM MASUK -->
      <div id="form-login">
        <div class="form-group">
          <label>Username Unik</label>
          <input type="text" id="login-username" placeholder="Masukkan username unik...">
        </div>
        <button class="btn-submit" onclick="submitLogin()">Masuk</button>
      </div>

      <!-- FORM DAFTAR -->
      <div id="form-register" style="display: none;">
        <div class="form-group">
          <label>Username Unik (Huruf Kecil Semua)</label>
          <input type="text" id="reg-username" placeholder="Contoh: wildan">
        </div>
        <div class="form-group">
          <label>Nama Tampilan</label>
          <input type="text" id="reg-fullname" placeholder="Contoh: Wildan Jaka">
        </div>
        <div class="form-group">
          <label>Foto Profil (Upload HP)</label>
          <label for="file-input" class="btn-file-upload">📁 Pilih Foto dari HP</label>
          <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'upload-preview')">
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Daftar Akun Baru</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Ubah Profil</h2>
      <p>ID Username: <strong id="edit-username-id" style="color:#3b82f6;">-</strong> (Permanen)</p>

      <div class="form-group">
        <label>Nama Tampilan Baru</label>
        <input type="text" id="edit-fullname" placeholder="Masukkan nama baru...">
      </div>

      <div class="form-group">
        <label>Ganti Foto Profil</label>
        <label for="file-edit-input" class="btn-file-upload">📁 Pilih Foto Baru dari HP</label>
        <input type="file" id="file-edit-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'edit-upload-preview')">
        <img id="edit-upload-preview" class="upload-preview" alt="Preview">
      </div>

      <button class="btn-submit" onclick="saveProfileChanges()">Simpan Perubahan</button>
      <button class="btn-submit" style="background:#ef4444; margin-top:8px;" onclick="logout()">Keluar Akun</button>
    </div>
  </div>

  <!-- TAMBAH KONTAK MODAL -->
  <div class="modal-backdrop" id="add-contact-modal">
    <div class="card-modal">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <h2>Tambah Kontak Baru</h2>
      <p>Masukkan username teman yang terdaftar di TriHive</p>

      <div class="form-group">
        <label>Username Teman</label>
        <input type="text" id="add-contact-username" placeholder="Masukkan username teman...">
      </div>

      <button class="btn-submit" onclick="submitAddContact()">+ Tambahkan Kontak</button>
    </div>
  </div>

  <!-- PROFILE PREVIEW MODAL -->
  <div class="modal-backdrop" id="profile-modal">
    <div class="profile-card">
      <button class="close-btn" onclick="closeModals()">✕</button>
      <img id="preview-avatar" src="" alt="Avatar">
      <h3 id="preview-name" style="margin-bottom: 2px; font-size:1.2rem;">Nama Kontak</h3>
      <p id="preview-username-id" style="color: #94a3b8; font-size: 0.75rem; margin-bottom: 6px;">@username</p>
      <p style="color: #10b981; font-size: 0.85rem; margin-bottom: 20px;">● Online</p>
      <button class="btn-ngobrol" onclick="openChat()">Ngobrol</button>
    </div>
  </div>

  <!-- CHAT MODAL RAPI -->
  <div class="modal-backdrop chat-backdrop" id="chat-modal">
    <div class="chat-card-full">
      <div class="chat-header-full">
        <div class="chat-user-full">
          <img id="chat-avatar" src="" alt="Avatar">
          <div>
            <h4 id="chat-name" style="color:white; font-size:0.95rem; font-weight:600;">Nama Kontak</h4>
            <span style="color:#10b981; font-size:0.75rem;">Online</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon-call" onclick="startCall()" title="Panggil Suara">📞</button>
          <button class="close-btn" style="position:static; font-size:1.4rem;" onclick="closeModals()">✕</button>
        </div>
      </div>
      <div class="chat-body-full" id="chat-body"></div>
      <div class="chat-footer-full">
        <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeypress="handleKey(event)">
        <button onclick="sendMsg()">➔</button>
      </div>
    </div>
  </div>

  <!-- CALL OVERLAY -->
  <div class="modal-backdrop" id="call-modal">
    <div class="call-card">
      <img class="call-avatar" id="call-avatar" src="" alt="Avatar">
      <h3 id="call-name" style="color:white; margin-bottom: 4px;">Nama Kontak</h3>
      <p style="color: #10b981; font-size: 0.85rem;">Terhubung - 00:12</p>
      <button class="btn-end-call" onclick="endCall()">✕</button>
    </div>
  </div>

  <!-- Firebase SDKs (CDN Version) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
      authDomain: "trihive-857cd.firebaseapp.com",
      databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "trihive-857cd",
      storageBucket: "trihive-857cd.firebasestorage.app",
      messagingSenderId: "434709340496",
      appId: "1:434709340496:web:3e1206dc10679ddc680c55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let contacts = [];
    let activeContact = null;
    let currentUser = null; 
    let currentDisplayName = "";
    let currentAvatarUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";
    let tempUploadAvatar = "";
    let unreadCounts = {};

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);

        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
      } catch (e) {
        console.log("Audio diblokir browser.");
      }
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let contactIdx = 0;

      for (let r = 0; r < 8; r++) {
        const row = document.createElement('div');
        row.className = 'grid-row';

        for (let c = 0; c < 10; c++) {
          const tile = document.createElement('div');
          const isUpright = (r + c) % 2 === 0;
          tile.className = `tile ${isUpright ? 'tile-upright' : 'tile-inverted'}`;

          const inner = document.createElement('div');
          inner.className = 'tile-inner';

          if (!isUpright && contacts.length > 0) {
            const person = contacts[contactIdx % contacts.length];
            const img = document.createElement('img');
            img.src = person.avatar || currentAvatarUrl;
            img.className = 'tile-photo';
            inner.appendChild(img);

            const badge = document.createElement('div');
            badge.className = 'unread-badge';
            badge.id = `badge-${person.username}`;
            if (unreadCounts[person.username] > 0) {
              badge.innerText = unreadCounts[person.username];
              badge.style.display = 'block';
            }
            tile.appendChild(badge);

            tile.onclick = () => {
              unreadCounts[person.username] = 0;
              if(document.getElementById(`badge-${person.username}`)) {
                document.getElementById(`badge-${person.username}`).style.display = 'none';
              }
              openProfile(person);
            };
            contactIdx++;
          } else {
            const bg = document.createElement('div');
            bg.className = 'tile-bg';
            inner.appendChild(bg);
          }

          tile.appendChild(inner);
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    let isPanning = false, startX = 0, startY = 0, panX = -100, panY = -100;

    function updateTransform() {
      canvas.style.transform = `translate3d(${panX}px, ${panY}px, 0)`;
    }
    updateTransform();

    function startPan(clientX, clientY, target) {
      if (target.closest('.modal-backdrop') || target.closest('header')) return;
      isPanning = true;
      startX = clientX - panX;
      startY = clientY - panY;
    }

    function movePan(clientX, clientY) {
      if (!isPanning) return;
      panX = clientX - startX;
      panY = clientY - startY;
      updateTransform();
    }

    function endPan() { isPanning = false; }

    viewport.addEventListener('mousedown', (e) => startPan(e.clientX, e.clientY, e.target));
    window.addEventListener('mousemove', (e) => movePan(e.clientX, e.clientY));
    window.addEventListener('mouseup', endPan);

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startPan(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isPanning && e.touches.length === 1) movePan(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', endPan);

    window.handleFileUpload = function(e, previewId) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempUploadAvatar = evt.target.result;
          const preview = document.getElementById(previewId);
          preview.src = tempUploadAvatar;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    window.switchTab = function(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    window.submitLogin = function() {
      const inputUsername = document.getElementById('login-username').value.trim().toLowerCase();
      if (!inputUsername) {
        alert("Masukkan username unik Anda!");
        return;
      }

      get(ref(db, `users/${inputUsername}`)).then((userSnapshot) => {
        if (userSnapshot.exists()) {
          const userData = userSnapshot.val();
          currentUser = inputUsername;
          currentDisplayName = userData.displayName || inputUsername;
          currentAvatarUrl = userData.avatar || currentAvatarUrl;

          setUserLoggedIn();
          loadUserContacts();
        } else {
          alert("Username tidak ditemukan! Silakan daftar akun baru terlebih dahulu.");
        }
      }).catch((err) => {
        alert("Gagal terhubung ke database: " + err.message);
      });
    }

    window.submitRegister = function() {
      const regUsername = document.getElementById('reg-username').value.trim().toLowerCase();
      const regFullname = document.getElementById('reg-fullname').value.trim() || regUsername;

      if (!regUsername) {
        alert("Username unik wajib diisi!");
        return;
      }

      get(ref(db, `users/${regUsername}`)).then((userSnapshot) => {
        if (userSnapshot.exists()) {
          alert("Username ini sudah dipakai orang lain! Silakan pilih username lain.");
          return;
        }

        const avatar = tempUploadAvatar || currentAvatarUrl;

        set(ref(db, `users/${regUsername}`), {
          username: regUsername,
          displayName: regFullname,
          avatar: avatar
        }).then(() => {
          currentUser = regUsername;
          currentDisplayName = regFullname;
          currentAvatarUrl = avatar;

          setUserLoggedIn();
          loadUserContacts();
        });
      }).catch((err) => {
        alert("Gagal mendaftarkan akun: " + err.message);
      });
    }

    function setUserLoggedIn() {
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('user-pill').style.display = 'flex';
      document.getElementById('current-user-name').innerText = currentDisplayName;
      document.getElementById('current-user-avatar').src = currentAvatarUrl;
    }

    function loadUserContacts() {
      const userContactsRef = ref(db, `user_contacts/${currentUser}`);
      onChildAdded(userContactsRef, (snapshot) => {
        const contactUsername = snapshot.key;
        get(ref(db, `users/${contactUsername}`)).then((cSnap) => {
          if (cSnap.exists()) {
            const cData = cSnap.val();
            if (!contacts.find(c => c.username === contactUsername)) {
              contacts.push({
                username: cData.username,
                name: cData.displayName || cData.username,
                avatar: cData.avatar
              });
              buildGrid();
              listenIncomingMessages(contactUsername);
            }
          }
        });
      });
    }

    function listenIncomingMessages(contactUsername) {
      const roomId = getRoomId(currentUser, contactUsername);
      const messagesRef = ref(db, `chats/${roomId}`);

      onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        if (data.sender === contactUsername) {
          const isChatOpen = activeContact && activeContact.username === contactUsername && document.getElementById('chat-modal').classList.contains('active');
          
          if (!isChatOpen) {
            playNotificationSound();
            unreadCounts[contactUsername] = (unreadCounts[contactUsername] || 0) + 1;
            buildGrid();
          }
        }
      });
    }

    window.openEditProfileModal = function() {
      document.getElementById('edit-username-id').innerText = `@${currentUser}`;
      document.getElementById('edit-fullname').value = currentDisplayName;
      document.getElementById('edit-upload-preview').src = currentAvatarUrl;
      document.getElementById('edit-upload-preview').style.display = 'block';
      document.getElementById('edit-profile-modal').classList.add('active');
    }

    window.saveProfileChanges = function() {
      const newName = document.getElementById('edit-fullname').value.trim();
      const newAvatar = tempUploadAvatar || currentAvatarUrl;

      if (!newName) {
        alert("Nama tidak boleh kosong!");
        return;
      }

      update(ref(db, `users/${currentUser}`), {
        displayName: newName,
        avatar: newAvatar
      }).then(() => {
        currentDisplayName = newName;
        currentAvatarUrl = newAvatar;

        document.getElementById('current-user-name').innerText = currentDisplayName;
        document.getElementById('current-user-avatar').src = currentAvatarUrl;
        tempUploadAvatar = "";

        alert("Profil berhasil diperbarui!");
        closeModals();
      });
    }

    window.openAddContactModal = function() {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu!");
        return;
      }
      document.getElementById('add-contact-modal').classList.add('active');
    }

    window.submitAddContact = function() {
      const contactUsername = document.getElementById('add-contact-username').value.trim().toLowerCase();
      if (!contactUsername) {
        alert("Masukkan username teman!");
        return;
      }

      if (contactUsername === currentUser) {
        alert("Anda tidak bisa menambahkan username sendiri!");
        return;
      }

      get(ref(db, `users/${contactUsername}`)).then((targetSnap) => {
        if (!targetSnap.exists()) {
          alert("Username tidak ditemukan di server!");
          return;
        }

        set(ref(db, `user_contacts/${currentUser}/${contactUsername}`), true);
        set(ref(db, `user_contacts/${contactUsername}/${currentUser}`), true);

        document.getElementById('add-contact-username').value = '';
        alert("Kontak berhasil ditambahkan!");
        closeModals();
      });
    }

    window.logout = function() {
      currentUser = null;
      contacts = [];
      unreadCounts = {};
      buildGrid();
      document.getElementById('user-pill').style.display = 'none';
      closeModals();
      document.getElementById('login-modal').classList.add('active');
    }

    window.openProfile = function(person) {
      activeContact = person;
      document.getElementById('preview-name').innerText = person.name;
      document.getElementById('preview-username-id').innerText = `@${person.username}`;
      document.getElementById('preview-avatar').src = person.avatar;
      document.getElementById('profile-modal').classList.add('active');
    }

    window.openChat = function() {
      closeModals();
      document.getElementById('chat-name').innerText = activeContact.name;
      document.getElementById('chat-avatar').src = activeContact.avatar;
      document.getElementById('chat-modal').classList.add('active');
      loadMessages();
    }

    function getRoomId(userA, userB) {
      return [userA, userB].sort().join('_');
    }

    function loadMessages() {
      const chatBody = document.getElementById('chat-body');
      chatBody.innerHTML = '';

      const roomId = getRoomId(currentUser, activeContact.username);
      const messagesRef = ref(db, `chats/${roomId}`);

      onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement('div');
        const isMe = data.sender === currentUser;
        msgDiv.className = `msg ${isMe ? 'msg-out' : 'msg-in'}`;
        msgDiv.innerHTML = `${data.text}${isMe ? '<span class="msg-status">✓✓</span>' : ''}`;
        chatBody.appendChild(msgDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    window.sendMsg = function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeContact) return;

      const roomId = getRoomId(currentUser, activeContact.username);
      const messagesRef = ref(db, `chats/${roomId}`);

      push(messagesRef, {
        sender: currentUser,
        text: text,
        timestamp: Date.now()
      });

      input.value = '';
    }

    window.handleKey = function(e) {
      if (e.key === 'Enter') window.sendMsg();
    }

    window.startCall = function() {
      document.getElementById('call-name').innerText = activeContact.name;
      document.getElementById('call-avatar').src = activeContact.avatar;
      document.getElementById('call-modal').classList.add('active');
    }

    window.endCall = function() {
      document.getElementById('call-modal').classList.remove('active');
    }

    window.closeModals = function() {
      document.querySelectorAll('.modal-backdrop').forEach(m => {
        if (m.id !== 'login-modal') m.classList.remove('active');
      });
    }

    buildGrid();
  </script>
</body>
</html>
