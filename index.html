<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TriHive - Triangular Mosaic Chat & Call</title>
  <meta name="description" content="Aplikasi WebRTC Call & Chat Mosaik Segitiga" />
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      overscroll-behavior-y: none;
    }

    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #60a5fa 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon-header:active {
      transform: scale(0.92);
      background: rgba(59, 130, 246, 0.25);
      color: #3b82f6;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px 4px 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .user-pill img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-pill span {
      font-size: 0.82rem;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    /* VIEWPORT CANVAS GRID */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
      perspective: 900px;
      touch-action: none;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .honeycomb-grid {
      position: relative;
      padding: 150px;
    }

    .grid-row {
      display: flex;
      align-items: flex-start;
      margin-top: -57px;
      width: max-content;
    }

    .grid-row:first-child {
      margin-top: 0;
    }

    .grid-row:nth-child(odd) {
      margin-left: 0;
    }

    .grid-row:nth-child(even) {
      margin-left: 50px;
    }

    .tile {
      position: relative;
      flex: 0 0 100px;
      width: 100px;
      height: 115px;
      margin: 0;
      cursor: pointer;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      animation: oceanWave 6s ease-in-out infinite alternate;
      animation-delay: calc(var(--col-index, 0) * 0.15s);
      transition: filter 0.2s, transform 0.2s;
    }

    @keyframes oceanWave {
      0% { transform: translateY(0px) rotateX(0deg) scale(1); }
      50% { transform: translateY(-7px) rotateX(4deg) scale(1.01); }
      100% { transform: translateY(3px) rotateX(-3deg) scale(0.99); }
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .tile-upright .tile-inner {
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .tile-inverted .tile-inner {
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      -webkit-clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    }

    .tile-bg {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #161b26 0%, #0d0f17 50%, #1e2433 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.03);
    }

    .tile-photo-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .tile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tile-photo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(11, 13, 18, 0.8) 100%);
      pointer-events: none;
    }

    .unread-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #dc2626;
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 12px;
      border: 1.5px solid #fff;
      display: none;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 11, 15, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card-modal {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 90%;
      max-width: 380px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .card-modal h2 { font-size: 1.35rem; margin-bottom: 6px; }
    .card-modal p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }

    .tab-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #3b82f6;
      color: white;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: #0d0e12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: white;
      outline: none;
      font-size: 0.92rem;
    }

    .form-group input:focus { border-color: #3b82f6; }

    .btn-file-upload {
      display: block;
      width: 100%;
      padding: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      color: #3b82f6;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .upload-preview {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      margin: 8px auto;
      display: none;
      border: 2px solid #3b82f6;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .profile-card {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 85%;
      max-width: 320px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
    }

    .profile-card img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
      margin-bottom: 12px;
    }

    .btn-ngobrol {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    /* CHAT MODAL */
    .chat-backdrop {
      align-items: center;
      padding: 10px;
    }

    .chat-card-full {
      width: 96%;
      max-width: 440px;
      height: 85vh;
      max-height: 740px;
      background: #191c24;
      border: 1.5px solid #2d3342;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header-full {
      padding: 14px 18px;
      background: #202430;
      border-bottom: 1px solid #2d3342;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-user-full {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user-full img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #dfb76c;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon-call, .btn-icon-video {
      background: #10b981;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-icon-video { background: #3b82f6; }

    .chat-body-full {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #14161d;
    }

    /* PESAN */
    .msg {
      max-width: 82%;
      min-width: 78px;
      padding: 8px 12px 22px 12px;
      font-size: 0.92rem;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      cursor: pointer;
    }

    .msg-in {
      background: #202430;
      color: #e2e8f0;
      align-self: flex-start;
      border-radius: 20px 20px 20px 6px;
      border: 1.5px solid #2d3342;
      margin-right: 30px;
    }

    .msg-out.unread {
      background: #1d4ed8;
      color: #ffffff;
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      border: 1.8px solid #dfb76c;
      margin-left: 30px;
    }

    .msg-out.read {
      background: #151b2b;
      color: #94a3b8;
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      border: 1.5px solid #2d3342;
      margin-left: 30px;
    }

    .msg-time {
      position: absolute;
      bottom: 4px;
      right: 10px;
      font-size: 0.62rem;
      color: #94a3b8;
    }

    .msg-in .msg-time { left: 10px; right: auto; }

    .msg-quote {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid #dfb76c;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    #reply-preview-container {
      display: none;
      background: #202430;
      padding: 8px 14px;
      border-top: 1px solid #2d3342;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
    }

    #reply-preview-text {
      color: #dfb76c;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .msg-img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 4px;
      display: block;
    }

    .btn-play-voice {
      background: #dfb76c;
      border: none;
      color: #1e293b;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
    }

    .voice-msg-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .voice-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: #dfb76c;
    }

    .chat-footer-full {
      background: #191c24;
      border-top: 1px solid #2d3342;
      display: flex;
      flex-direction: column;
    }

    .chat-input-row {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-footer-full input {
      flex: 1;
      min-width: 0;
      padding: 12px 18px;
      background: #202430;
      border: 1px solid #2d3342;
      border-radius: 26px;
      color: white;
      outline: none;
      font-size: 0.92rem;
    }

    .btn-chat-action {
      background: #dfb76c;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #10141d;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-mic, .btn-gallery {
      background: #202430;
      border: 1px solid #2d3342;
      color: #dfb76c;
    }

    /* PANGGILAN LAYAR PENUH */
    #call-modal.modal-backdrop { background: rgba(0, 0, 0, 0.95); }

    .call-card {
      background: transparent;
      border: none;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 5;
      display: none;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 6;
    }

    #local-video {
      position: absolute;
      top: 70px;
      right: 16px;
      width: 90px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid white;
      background: #222;
      z-index: 15;
    }

    .btn-flip-camera {
      position: absolute;
      top: 70px;
      left: 16px;
      width: 42px;
      height: 42px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
    }

    .call-overlay-info {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .call-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #10b981;
      margin-bottom: 16px;
    }

    .call-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .btn-accept-call, .btn-end-call {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-accept-call { background: #10b981; }
    .btn-end-call { background: #ef4444; }

    .btn-unmute-audio {
      background: #3b82f6;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 12px;
      display: none;
    }

    /* IN-APP TOAST */
    #app-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      background: rgba(20, 24, 35, 0.96);
      border: 1px solid rgba(59, 130, 246, 0.5);
      color: #f1f5f9;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.88rem;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #app-toast.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
    }

    /* OPTIMISASI PERFORMA HP & CHAT CEPAT */
    body.modal-open .tile {
      animation-play-state: paused !important;
    }

    @media (max-width: 768px) {
      .modal-backdrop {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: rgba(10, 11, 15, 0.95);
      }
      .card-modal, .profile-card {
        backdrop-filter: none !important;
        background: #141620;
      }
      .chat-backdrop {
        padding: 0;
      }
      .chat-card-full {
        width: 100vw;
        max-width: 100vw;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
      }
      .chat-body-full {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <span class="brand-title">TriHive</span>
    </div>
    <div class="header-controls">
      <button class="btn-icon-header" onclick="openAddContactModal()" title="Tambah Kontak">➕</button>
      <button class="btn-icon-header" id="enable-notifications-btn" onclick="enablePushNotifications()" title="Notifikasi">🔔</button>
      <div class="user-pill" id="user-pill" style="display: none;" onclick="openEditProfileModal()">
        <img id="current-user-avatar" src="" alt="Avatar">
        <span id="current-user-name">Pengguna</span>
      </div>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas">
      <div class="honeycomb-grid" id="grid"></div>
    </div>
  </div>

  <audio id="notif-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="ring-audio" src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3" loop preload="auto"></audio>
  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- LOGIN MODAL -->
  <div class="modal-backdrop active" id="login-modal">
    <div class="card-modal">
      <h2>Masuk Ke TriHive</h2>
      <p>Aplikasi Chat & Call Mosaik Segitiga</p>
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>
      <div id="form-login">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Username...">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Password...">
        </div>
        <button class="btn-submit" onclick="submitLogin()">Masuk</button>
      </div>
      <div id="form-register" style="display: none;">
        <div class="form-group">
          <label>Username (Huruf Kecil)</label>
          <input type="text" id="reg-username" placeholder="contoh: wildan">
        </div>
        <div class="form-group">
          <label>Nama Tampilan</label>
          <input type="text" id="reg-fullname" placeholder="Nama Lengkap...">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Password...">
        </div>
        <div class="form-group">
          <label>Foto Profil</label>
          <label for="file-input" class="btn-file-upload">📁 Pilih Foto</label>
          <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'upload-preview')">
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Daftar</button>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->

  <div id="app-toast"></div>

  <!-- STANDALONE SCRIPT UTAMA MENGGUNAKAN CDN FIREBASE RESMI (COMPATIBLE CORDOVA) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, push, onChildAdded, onChildChanged, set, get, update, remove, onValue, onDisconnect, query, limitToLast
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
      authDomain: "trihive-857cd.firebaseapp.com",
      databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "trihive-857cd",
      storageBucket: "trihive-857cd.firebasestorage.app",
      messagingSenderId: "434709340496",
      appId: "1:434709340496:web:3e1206dc10679ddc680c55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Toast
    function showToast(message, duration = 3000) {
      let toast = document.getElementById('app-toast');
      if (!toast) return;
      toast.innerHTML = `<span class="toast-dot"></span><span>${message}</span>`;
      toast.classList.add('active');
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.classList.remove('active');
      }, duration);
    }
    window.alert = function(msg) { showToast(String(msg)); };

    // Notifikasi sistem
    function showSystemNotification(title, options = {}) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const notif = new Notification(title, {
          icon: 'logo.png',
          badge: 'logo.png',
          tag: options.tag || 'trihive',
          ...options
        });
        notif.onclick = () => { window.focus(); notif.close(); };
      } catch (err) {}
    }

    window.enablePushNotifications = async function() {
      if (!('Notification' in window)) {
        showToast("Browser tidak mendukung notifikasi.");
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          showToast("Notifikasi berhasil diaktifkan!");
          document.getElementById('enable-notifications-btn').style.color = '#10b981';
        }
      } catch (e) {}
    };

    // Audio Autoplay Unlock
    let isAudioUnlocked = false;
    function unlockAudio() {
      if (isAudioUnlocked) return;
      ['notif-audio', 'ring-audio', 'remote-audio'].forEach(id => {
        const a = document.getElementById(id);
        if (a) {
          const p = a.play();
          if (p) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        }
      });
      isAudioUnlocked = true;
    }
    window.addEventListener('click', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });

    function playNotificationSound() {
      const a = document.getElementById('notif-audio');
      if (a) { a.currentTime = 0; a.play().catch(() => {}); }
    }
    function playRingingSound() {
      const a = document.getElementById('ring-audio');
      if (a) { a.currentTime = 0; a.play().catch(() => {}); }
    }
    function stopRingingSound() {
      const a = document.getElementById('ring-audio');
      if (a) { a.pause(); a.currentTime = 0; }
    }

    // STATE
    let currentUser = localStorage.getItem('trihive_user') || null;
    let currentDisplayName = localStorage.getItem('trihive_name') || 'Pengguna';
    let currentAvatarUrl = localStorage.getItem('trihive_avatar') || 'logo.png';
    let contacts = [];
    let unreadCounts = {};
    let activeContact = null;
    let replyingTo = null;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let typingTimeout = null;
    let activeStatusListener = null;
    let activeProfileStatusListener = null;
    let activeListeners = {};

    // WEBRTC STATE (MULTI-STUN & QUEUED CANDIDATES)
    let peerConnection = null;
    let localStream = null;
    let isVideoCall = false;
    let currentFacingMode = 'user';
    let isIncomingListening = false;
    let targetUser = null;
    let callTimeoutTimer = null;
    let pendingIceCandidates = [];

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    };

    // GRID
    const ROWS = 12;
    const COLS = 12;
    let scale = 1;
    let pointX = (window.innerWidth - 1200) / 2;
    let pointY = (window.innerHeight - 800) / 2;

    function buildGrid() {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      let contactIdx = 0;

      for (let r = 0; r < ROWS; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'grid-row';

        for (let c = 0; c < COLS; c++) {
          const tile = document.createElement('div');
          const isUpright = (r + c) % 2 === 0;
          tile.className = `tile ${isUpright ? 'tile-upright' : 'tile-inverted'}`;
          tile.style.setProperty('--col-index', `${c}`);

          const inner = document.createElement('div');
          inner.className = 'tile-inner';

          if (contactIdx < contacts.length) {
            const contact = contacts[contactIdx];
            const unread = unreadCounts[contact.username] || 0;

            const photoWrapper = document.createElement('div');
            photoWrapper.className = 'tile-photo-wrapper';

            const img = document.createElement('img');
            img.className = 'tile-photo';
            img.src = contact.avatar || currentAvatarUrl;
            img.onerror = () => { img.src = 'logo.png'; };

            const overlay = document.createElement('div');
            overlay.className = 'tile-photo-overlay';

            const badge = document.createElement('div');
            badge.className = 'unread-badge';
            badge.innerText = unread > 99 ? '99+' : unread;
            if (unread > 0) badge.style.display = 'block';

            photoWrapper.appendChild(img);
            photoWrapper.appendChild(overlay);
            photoWrapper.appendChild(badge);
            inner.appendChild(photoWrapper);

            tile.onclick = () => { window.openProfile(contact); };
            contactIdx++;
          } else {
            const bg = document.createElement('div');
            bg.className = 'tile-bg';
            inner.appendChild(bg);

            tile.onclick = () => {
              if (currentUser) window.openAddContactModal();
              else showToast("Silakan login dulu.");
            };
          }

          tile.appendChild(inner);
          rowEl.appendChild(tile);
        }
        grid.appendChild(rowEl);
      }
    }

    // LOGIN & REGISTER
    window.switchTab = function(tab) {
      document.getElementById('tab-login')?.classList.toggle('active', tab === 'login');
      document.getElementById('tab-register')?.classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    };

    window.submitLogin = function() {
      unlockAudio();
      const u = document.getElementById('login-username').value.trim().toLowerCase();
      const p = document.getElementById('login-password').value.trim();
      if (!u || !p) return showToast("Isi username & password!");

      get(ref(db, `users/${u}`)).then(snap => {
        if (snap.exists() && snap.val().password === p) {
          currentUser = u;
          currentDisplayName = snap.val().displayName || u;
          currentAvatarUrl = snap.val().avatar || currentAvatarUrl;
          localStorage.setItem('trihive_user', currentUser);
          localStorage.setItem('trihive_name', currentDisplayName);
          localStorage.setItem('trihive_avatar', currentAvatarUrl);
          setUserLoggedIn();
          loadUserContacts();
          setupIncomingCallsListener();
          showToast(`Selamat datang, ${currentDisplayName}!`);
        } else {
          showToast("Username atau password salah!");
        }
      });
    };

    window.submitRegister = function() {
      unlockAudio();
      const u = document.getElementById('reg-username').value.trim().toLowerCase();
      const f = document.getElementById('reg-fullname').value.trim() || u;
      const p = document.getElementById('reg-password').value.trim();
      if (!u || !p) return showToast("Isi data dengan lengkap!");

      get(ref(db, `users/${u}`)).then(snap => {
        if (snap.exists()) return showToast("Username sudah dipakai!");
        set(ref(db, `users/${u}`), { username: u, displayName: f, password: p, avatar: currentAvatarUrl }).then(() => {
          currentUser = u;
          currentDisplayName = f;
          localStorage.setItem('trihive_user', currentUser);
          localStorage.setItem('trihive_name', currentDisplayName);
          localStorage.setItem('trihive_avatar', currentAvatarUrl);
          setUserLoggedIn();
          loadUserContacts();
          setupIncomingCallsListener();
          showToast("Pendaftaran sukses!");
        });
      });
    };

    function setUserLoggedIn() {
      document.getElementById('login-modal')?.classList.remove('active');
      const userPill = document.getElementById('user-pill');
      if (userPill) userPill.style.display = 'flex';
      document.getElementById('current-user-name').innerText = currentDisplayName;
      document.getElementById('current-user-avatar').src = currentAvatarUrl;

      if (!currentUser) return;
      const statusRef = ref(db, `status/${currentUser}`);
      onValue(ref(db, '.info/connected'), (snap) => {
        if (snap.val() === true) {
          onDisconnect(statusRef).set({ isOnline: false, lastSeen: Date.now() });
          set(statusRef, { isOnline: true, lastSeen: Date.now() });
        }
      });
    }

    function loadUserContacts() {
      if (!currentUser) return;
      onChildAdded(ref(db, `user_contacts/${currentUser}`), (snap) => {
        const cUser = snap.key;
        if (!cUser) return;
        get(ref(db, `users/${cUser}`)).then(cSnap => {
          if (cSnap.exists()) {
            const data = cSnap.val();
            if (!contacts.find(c => c.username === cUser)) {
              contacts.push({ username: data.username, name: data.displayName || data.username, avatar: data.avatar });
              buildGrid();
              listenIncomingMessages(cUser);
            }
          }
        });
      });
    }

    function listenIncomingMessages(cUser) {
      if (!currentUser || activeListeners[cUser]) return;
      activeListeners[cUser] = true;
      const roomId = [currentUser, cUser].sort().join('_');
      let isInit = true;
      get(ref(db, `chats/${roomId}`)).then(() => { isInit = false; });

      onChildAdded(ref(db, `chats/${roomId}`), (snap) => {
        const data = snap.val();
        if (!data || data.sender !== cUser) return;
        const isOpen = activeContact && activeContact.username === cUser && document.getElementById('chat-modal')?.classList.contains('active');

        if (isOpen && !document.hidden) {
          update(ref(db, `chats/${roomId}/${snap.key}`), { unread: false });
        } else if (data.unread !== false) {
          if (!isInit) playNotificationSound();
          unreadCounts[cUser] = (unreadCounts[cUser] || 0) + 1;
          buildGrid();
          if (!isInit && (document.hidden || !isOpen)) {
            showSystemNotification(`Pesan baru dari ${cUser}`, { body: data.text || 'Mengirim pesan' });
          }
        }
      });
    }

    // WEBRTC CALLING DENGAN CANDIDATE QUEUEING
    async function handleIncomingIceCandidate(cand) {
      if (!cand || !cand.candidate) return;
      if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
      } else {
        pendingIceCandidates.push(cand);
      }
    }

    async function flushPendingIceCandidates() {
      if (!peerConnection || !peerConnection.remoteDescription) return;
      const queue = [...pendingIceCandidates];
      pendingIceCandidates = [];
      for (const cand of queue) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
      }
    }

    function setupIncomingCallsListener() {
      if (!currentUser || isIncomingListening) return;
      isIncomingListening = true;

      onValue(ref(db, `calls/${currentUser}`), async (snap) => {
        const data = snap.val();
        const incModal = document.getElementById('incoming-call-modal');
        const callModal = document.getElementById('call-modal');

        if (data && data.status === 'calling') {
          targetUser = data.caller;
          isVideoCall = !!data.isVideo;
          playRingingSound();
          document.getElementById('incoming-name').innerText = data.callerName || targetUser;
          document.getElementById('incoming-avatar').src = data.callerAvatar || 'logo.png';
          document.getElementById('incoming-call-type').innerText = isVideoCall ? "Video Call Masuk..." : "Voice Call Masuk...";
          incModal?.classList.add('active');
          showSystemNotification(isVideoCall ? "📹 Video Call Masuk" : "📞 Voice Call Masuk", { body: `${targetUser} memanggil Anda` });
        } else if (data && data.status === 'connected') {
          stopRingingSound();
          document.getElementById('call-status-text').innerText = "Terhubung";
        } else {
          stopRingingSound();
          cleanupWebRTC();
          incModal?.classList.remove('active');
          callModal?.classList.remove('active');
        }
      });

      onValue(ref(db, `webrtc_signals/${currentUser}/answer`), async (snap) => {
        const ans = snap.val();
        if (ans && peerConnection && peerConnection.signalingState === "have-local-offer") {
          try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(ans));
            stopRingingSound();
            document.getElementById('call-status-text').innerText = "Terhubung";
            await flushPendingIceCandidates();
          } catch (e) {}
        }
      });

      onChildAdded(ref(db, `webrtc_signals/${currentUser}/candidates`), async (snap) => {
        const cand = snap.val();
        if (cand) await handleIncomingIceCandidate(cand);
      });
    }

    async function initMediaStream(video) {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: currentFacingMode } : false });
      } catch (e) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        video = false;
        isVideoCall = false;
      }
      const localVid = document.getElementById('local-video');
      const videoBox = document.getElementById('video-box');
      if (localVid && video) {
        localVid.srcObject = localStream;
        videoBox.style.display = 'block';
        document.getElementById('btn-flip').style.display = 'flex';
      } else {
        videoBox.style.display = 'none';
        document.getElementById('btn-flip').style.display = 'none';
      }
      return localStream;
    }

    function createPeerConnection(target) {
      if (peerConnection) peerConnection.close();
      pendingIceCandidates = [];
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = (event) => {
        const remoteStream = event.streams[0];
        const remoteAudio = document.getElementById('remote-audio');
        const remoteVideo = document.getElementById('remote-video');
        if (isVideoCall && remoteVideo) {
          remoteVideo.srcObject = remoteStream;
          document.getElementById('video-box').style.display = 'block';
          remoteVideo.play().catch(() => {});
        }
        if (remoteAudio) {
          remoteAudio.srcObject = remoteStream;
          remoteAudio.play().catch(() => {
            document.querySelector('.btn-unmute-audio').style.display = 'inline-block';
          });
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && currentUser && target) {
          push(ref(db, `webrtc_signals/${target}/candidates`), event.candidate.toJSON());
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'connected') {
          document.getElementById('call-status-text').innerText = "Terhubung";
          stopRingingSound();
        } else if (peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'disconnected') {
          showToast("Panggilan terputus.");
          window.endCall();
        }
      };
    }

    window.startCall = async function(video) {
      if (!activeContact || !currentUser) return;
      unlockAudio();
      isVideoCall = video;
      targetUser = activeContact.username;
      await initMediaStream(video);
      createPeerConnection(targetUser);

      await remove(ref(db, `webrtc_signals/${targetUser}`));
      await remove(ref(db, `webrtc_signals/${currentUser}`));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await set(ref(db, `webrtc_signals/${targetUser}/offer`), { type: offer.type, sdp: offer.sdp });
      await set(ref(db, `calls/${targetUser}`), {
        caller: currentUser, callerName: currentDisplayName, callerAvatar: currentAvatarUrl, isVideo: video, status: 'calling', timestamp: Date.now()
      });

      playRingingSound();
      document.getElementById('call-name').innerText = activeContact.name;
      document.getElementById('call-avatar').src = activeContact.avatar || 'logo.png';
      document.getElementById('call-status-text').innerText = "Memanggil...";
      document.getElementById('call-modal')?.classList.add('active');
    };

    window.acceptCall = async function() {
      stopRingingSound();
      document.getElementById('incoming-call-modal')?.classList.remove('active');
      if (!targetUser || !currentUser) return;

      await initMediaStream(isVideoCall);
      createPeerConnection(targetUser);

      const offerSnap = await get(ref(db, `webrtc_signals/${currentUser}/offer`));
      if (offerSnap.exists()) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
        await flushPendingIceCandidates();

        const candSnap = await get(ref(db, `webrtc_signals/${currentUser}/candidates`));
        if (candSnap.exists()) {
          const val = candSnap.val();
          for (const k in val) await handleIncomingIceCandidate(val[k]);
          await flushPendingIceCandidates();
        }

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await set(ref(db, `webrtc_signals/${targetUser}/answer`), { type: answer.type, sdp: answer.sdp });
      }

      await update(ref(db, `calls/${currentUser}`), { status: 'connected' });
      await update(ref(db, `calls/${targetUser}`), { status: 'connected' });

      document.getElementById('call-name').innerText = targetUser;
      document.getElementById('call-avatar').src = currentAvatarUrl;
      document.getElementById('call-status-text').innerText = "Terhubung";
      document.getElementById('call-modal')?.classList.add('active');
    };

    window.rejectCall = function() {
      stopRingingSound();
      if (targetUser) update(ref(db, `calls/${targetUser}`), { status: 'rejected' });
      if (currentUser) remove(ref(db, `calls/${currentUser}`));
      cleanupWebRTC();
      document.getElementById('incoming-call-modal')?.classList.remove('active');
    };

    window.endCall = function() {
      stopRingingSound();
      if (targetUser) remove(ref(db, `calls/${targetUser}`));
      if (activeContact) remove(ref(db, `calls/${activeContact.username}`));
      if (currentUser) remove(ref(db, `calls/${currentUser}`));
      cleanupWebRTC();
      document.getElementById('call-modal')?.classList.remove('active');
      document.getElementById('incoming-call-modal')?.classList.remove('active');
    };

    function cleanupWebRTC() {
      pendingIceCandidates = [];
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('video-box').style.display = 'none';
      document.getElementById('btn-flip').style.display = 'none';
      targetUser = null;
    }

    // CHAT (DILIMIT 50 TERAKHIR & PAUSE ANIMASI LATAR)
    let activeChatAdded = null;
    let currentChatRoom = null;

    window.openChat = function() {
      if (!activeContact || !currentUser) return;
      document.querySelectorAll('.modal-backdrop').forEach(m => {
        if (m.id !== 'login-modal' && m.id !== 'chat-modal') m.classList.remove('active');
      });

      document.body.classList.add('modal-open');
      document.getElementById('chat-modal')?.classList.add('active');
      document.getElementById('chat-name').innerText = activeContact.name;
      document.getElementById('chat-avatar').src = activeContact.avatar || 'logo.png';
      unreadCounts[activeContact.username] = 0;
      buildGrid();
      loadMessages();
    };

    function loadMessages() {
      if (!currentUser || !activeContact) return;
      const chatBody = document.getElementById('chat-body');
      const roomId = [currentUser, activeContact.username].sort().join('_');

      if (activeChatAdded && currentChatRoom !== roomId) {
        activeChatAdded();
        activeChatAdded = null;
      }

      if (currentChatRoom !== roomId) {
        chatBody.innerHTML = '';
        currentChatRoom = roomId;
      }

      // KUNCI PERBAIKAN: limitToLast(50) membuat obrolan terbuka instan di HP
      const chatQuery = query(ref(db, `chats/${roomId}`), limitToLast(50));

      activeChatAdded = onChildAdded(chatQuery, (snap) => {
        const data = snap.val();
        if (!data) return;
        const isMe = data.sender === currentUser;
        if (!isMe && data.unread !== false) {
          update(ref(db, `chats/${roomId}/${snap.key}`), { unread: false });
        }
        renderMessage(snap.key, data, isMe);
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    function renderMessage(key, data, isMe) {
      const chatBody = document.getElementById('chat-body');
      if (document.getElementById(`msg-${key}`)) return;

      const div = document.createElement('div');
      div.id = `msg-${key}`;
      div.className = `msg ${isMe ? 'msg-out' : 'msg-in'} ${data.unread ? 'unread' : 'read'}`;

      let html = '';
      if (data.replyTo) html += `<div class="msg-quote">Balasan: "${data.replyTo.text}"</div>`;
      if (data.type === 'voice') html += `<div class="voice-msg-container"><button class="btn-play-voice" onclick="playVoice(this, '${data.audio}')">▶</button><span class="voice-tag">Pesan Suara</span></div>`;
      else if (data.type === 'image') html += `<img class="msg-img" src="${data.image}">`;
      else html += `<div>${data.text || ''}</div>`;

      const t = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
      html += `<span class="msg-time">${t}</span>`;

      div.innerHTML = html;
      div.onclick = () => { window.setReply(data.text || 'Media', data.sender); };
      chatBody.appendChild(div);
    }

    window.sendMsg = function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeContact || !currentUser) return;
      const roomId = [currentUser, activeContact.username].sort().join('_');
      push(ref(db, `chats/${roomId}`), {
        sender: currentUser, type: 'text', text, unread: true, timestamp: Date.now(),
        replyTo: replyingTo ? { text: replyingTo.text, sender: replyingTo.sender } : null
      });
      input.value = '';
      window.cancelReply();
    };

    window.closeModals = function() {
      document.body.classList.remove('modal-open');
      document.querySelectorAll('.modal-backdrop').forEach(m => {
        if (m.id !== 'login-modal') m.classList.remove('active');
      });
    };

    window.openProfile = function(person) {
      activeContact = person;
      document.getElementById('preview-name').innerText = person.name;
      document.getElementById('preview-username-id').innerText = `@${person.username}`;
      document.getElementById('preview-avatar').src = person.avatar || 'logo.png';
      document.body.classList.add('modal-open');
      document.getElementById('profile-modal')?.classList.add('active');
    };

    window.openAddContactModal = function() {
      document.body.classList.add('modal-open');
      document.getElementById('add-contact-modal')?.classList.add('active');
    };

    window.submitAddContact = function() {
      const u = document.getElementById('add-contact-username').value.trim().toLowerCase();
      if (!u || u === currentUser) return showToast("Username tidak valid!");
      get(ref(db, `users/${u}`)).then(snap => {
        if (!snap.exists()) return showToast("Pengguna tidak ditemukan!");
        set(ref(db, `user_contacts/${currentUser}/${u}`), true);
        set(ref(db, `user_contacts/${u}/${currentUser}`), true);
        window.closeModals();
        showToast("Kontak ditambahkan!");
      });
    };

    window.handleKey = function(e) { if (e.key === 'Enter') window.sendMsg(); };

    // Inisialisasi awal
    buildGrid();
    if (currentUser) {
      setUserLoggedIn();
      loadUserContacts();
      setupIncomingCallsListener();
    }
  </script>
</body>
</html>
