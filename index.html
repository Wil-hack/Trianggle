<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TriHive - Chat & Call</title>
  <meta name="theme-color" content="#0B0F19">
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="cordova.js"></script>
  <style>
    :root {
      --bg-app: #0B0F19;
      --bg-surface: #151B2B;
      --bg-surface-hover: #1E2638;
      --bg-input: #111827;
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      
      --accent-primary: #6366F1;
      --accent-gradient: linear-gradient(135deg, #6366F1, #8B5CF6);
      --accent-glow: rgba(99, 102, 241, 0.3);
      
      --success: #10B981;
      --danger: #F43F5E;
      
      --border-light: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      
      --msg-in: #1E2638;
      --msg-out: linear-gradient(135deg, #6366F1, #8B5CF6);
      --msg-out-read: #1A2235;

      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 999px;
      
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      --bg-app: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #F8FAFC;
      --bg-input: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-light: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.12);
      --msg-in: #FFFFFF;
      --msg-out-read: #E2E8F0;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-app); color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
    }
    input, textarea { user-select: text; -webkit-user-select: text; font-family: inherit; }

    .ico {
      width: 22px; height: 22px; flex-shrink: 0;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      display: inline-block; vertical-align: middle;
    }
    .ico.sm { width: 16px; height: 16px; stroke-width: 2.2; }
    .ico.lg { width: 28px; height: 28px; }

    /* HEADER */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px; z-index: 100;
    }
    [data-theme="light"] header { background: rgba(255, 255, 255, 0.85); }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; }
    .brand-title {
      font-weight: 700; font-size: 1.2rem; letter-spacing: 0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .btn-icon-header {
      background: var(--bg-surface); border: 1px solid var(--border-light);
      color: var(--text-muted); width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s var(--ease);
    }
    .btn-icon-header:active { transform: scale(0.92); background: var(--bg-surface-hover); color: var(--text-main); }
    
    .user-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-surface); padding: 4px 12px 4px 4px;
      border-radius: var(--radius-full); border: 1px solid var(--border-light);
      cursor: pointer; transition: all 0.2s var(--ease);
    }
    .user-pill img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .user-pill span { font-size: 0.85rem; font-weight: 600; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* GRID MOSAIC */
    #viewport {
      width: 100vw; height: 100vh; overflow: hidden;
      position: relative; cursor: grab; touch-action: none !important;
    }
    #viewport:active { cursor: grabbing; }
    #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .honeycomb-grid { position: relative; padding: 150px; }
    .grid-row { display: flex; align-items: flex-start; margin-top: -57px; width: max-content; }
    .grid-row:first-child { margin-top: 0; }
    .grid-row:nth-child(even) { margin-left: 50px; }
    .tile {
      position: relative; flex: 0 0 100px; width: 100px; height: 115px;
      cursor: pointer; animation: float 8s ease-in-out infinite alternate;
      animation-delay: calc(var(--col-index, 0) * 0.08s);
      transition: filter 0.3s var(--ease);
    }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(2px); } }
    body.modal-open .tile { animation-play-state: paused !important; }
    .tile-inner { width: 100%; height: 100%; position: relative; }
    .tile-upright .tile-inner { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); -webkit-clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
    .tile-inverted .tile-inner { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); -webkit-clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
    .tile-bg { width: 100%; height: 100%; background: var(--bg-surface); transition: all 0.3s var(--ease); }
    .tile-photo-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .tile-photo { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; transition: transform 0.4s var(--ease); }
    .tile-photo-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85) 100%); pointer-events: none; }
    .tile-name {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; font-weight: 600; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px;
      text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .tile-online-dot {
      position: absolute; top: 12px; left: 12px; width: 10px; height: 10px;
      background: var(--success); border-radius: 50%; border: 2px solid var(--bg-app);
      box-shadow: 0 0 0 2px var(--success);
    }
    .unread-badge {
      position: absolute; top: 8px; right: 8px;
      background: var(--danger); color: white;
      font-size: 0.65rem; font-weight: 700;
      padding: 2px 6px; border-radius: var(--radius-full);
      border: 2px solid var(--bg-app);
    }

    /* MODAL BASE */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 200; display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease);
    }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    
    .card-modal {
      background: var(--bg-surface); border: 1px solid var(--border-light);
      border-radius: var(--radius-lg); width: 90%; max-width: 380px; padding: 24px;
      text-align: center; position: relative; box-shadow: var(--shadow-lg);
      transform: translateY(20px) scale(0.95); transition: transform 0.3s var(--ease);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-backdrop.active .card-modal { transform: translateY(0) scale(1); }
    
    .card-modal h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .card-modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input {
      width: 100%; padding: 12px 16px; background: var(--bg-app);
      border: 1px solid var(--border-light); border-radius: var(--radius-md);
      color: var(--text-main); font-size: 0.95rem; outline: none; transition: border 0.2s;
    }
    .form-group input:focus { border-color: var(--accent-primary); }
    
    .btn-file-upload {
      display: block; padding: 12px; background: var(--bg-surface-hover);
      border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
      color: var(--accent-primary); text-align: center; font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    .upload-preview {
      width: 70px; height: 70px; border-radius: 50%; object-fit: cover;
      margin: 10px auto; display: none; border: 3px solid var(--accent-primary);
    }

    .btn-submit {
      width: 100%; padding: 14px; background: var(--accent-gradient);
      border: none; border-radius: var(--radius-md); color: white;
      font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-ghost { background: var(--bg-surface-hover); color: var(--text-main); border: 1px solid var(--border-light); }
    .btn-danger { background: var(--danger); }
    
    .close-btn {
      position: absolute; top: 16px; right: 16px; background: var(--bg-surface-hover);
      border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* TAB */
    .tab-group { display: flex; background: var(--bg-app); padding: 4px; border-radius: var(--radius-md); margin-bottom: 18px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--accent-gradient); color: white; }

    /* CHAT UI PREMIUM */
    .chat-card-full {
      width: 100vw; height: 100vh; height: 100dvh; background: var(--bg-app);
      display: flex; flex-direction: column; overflow: hidden;
    }
    
    .chat-header-full {
      padding: 12px 16px; background: var(--bg-app);
      border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between;
      height: 68px; flex-shrink: 0; z-index: 10;
    }
    .chat-user-full { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; min-width: 0; }
    .chat-user-full img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-surface-hover); }
    .chat-user-full div { min-width: 0; }
    .chat-user-full h4 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-user-full span { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-call {
      background: var(--bg-surface); border: 1px solid var(--border-light);
      width: 40px; height: 40px; border-radius: 50%; color: var(--accent-primary);
      display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
    .btn-delete {
      background: transparent; border: none; width: 40px; height: 40px; border-radius: 50%;
      color: var(--danger); display: flex; justify-content: center; align-items: center; cursor: pointer;
    }

    .chat-body-full {
      flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; gap: 12px;
      background: var(--bg-app);
    }

    /* CHAT BUBBLE */
    .msg {
      max-width: 82%; padding: 10px 14px; font-size: 0.95rem; line-height: 1.45;
      position: relative; word-break: break-word; animation: msgIn 0.3s var(--ease);
      display: flex; flex-direction: column;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-in { background: var(--msg-in); color: var(--text-main); align-self: flex-start; border-radius: 18px 18px 18px 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .msg-out { background: var(--msg-out); color: white; align-self: flex-end; border-radius: 18px 18px 4px 18px; box-shadow: 0 4px 12px var(--accent-glow); }
    .msg-out.read { background: var(--msg-out-read); color: var(--text-muted); box-shadow: none; border: 1px solid var(--border-light); }

    .msg-text { margin-bottom: 4px; }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 0.68rem; opacity: 0.8; margin-top: 2px; }
    .msg-out.read .msg-meta .ico { color: var(--success); }

    .msg-quote {
      background: rgba(0,0,0,0.15); border-left: 3px solid var(--accent-primary);
      padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 8px; opacity: 0.9;
    }
    .msg-img { max-width: 100%; border-radius: 12px; margin-bottom: 4px; display: block; }
    
    .voice-msg-container { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
    .btn-play-voice {
      background: rgba(255,255,255,0.2); border: none; color: inherit;
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }

    /* INPUT BAR */
    .chat-footer-full {
      background: var(--bg-app); border-top: 1px solid var(--border-light);
      padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0;
    }
    .chat-input-row { display: flex; gap: 6px; align-items: center; }
    .chat-input-row input[type="text"] {
      flex: 1; background: var(--bg-surface); border: 1px solid var(--border-light);
      padding: 12px 18px; border-radius: var(--radius-full); color: var(--text-main);
      font-size: 0.95rem; outline: none; transition: border 0.2s;
    }
    .chat-input-row input[type="text"]:focus { border-color: var(--accent-primary); }
    
    .btn-chat-action {
      background: transparent; border: none; color: var(--text-muted);
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-chat-action:active { background: var(--bg-surface); color: var(--text-main); }
    .btn-chat-send { background: var(--accent-gradient); color: white; box-shadow: 0 4px 10px var(--accent-glow); }
    .btn-chat-send:active { transform: scale(0.92); }
    .btn-mic.recording { background: var(--danger); color: white; animation: pulse 1.5s infinite; }

    /* REPLY PREVIEW */
    #reply-preview-container {
      display: none; background: var(--bg-surface); padding: 8px 16px;
      border-top: 1px solid var(--border-light); align-items: center; justify-content: space-between; font-size: 0.85rem;
    }
    #reply-preview-text { color: var(--accent-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* CALL UI */
    .call-card { width: 100vw; height: 100vh; position: relative; background: #000; display: flex; flex-direction: column; justify-content: space-between; }
    .video-container { position: absolute; inset: 0; display: none; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; top: 80px; right: 16px; width: 90px; height: 120px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); z-index: 15; }
    .btn-flip-camera { position: absolute; top: 80px; left: 16px; width: 44px; height: 44px; background: rgba(0,0,0,0.5); border-radius: 50%; color: white; border: none; display: none; z-index: 15; }
    
    .call-overlay-info {
      position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 20px 60px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      display: flex; flex-direction: column; align-items: center; z-index: 20;
    }
    .call-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-primary); margin-bottom: 16px; box-shadow: var(--shadow-lg); }
    .call-actions { display: flex; gap: 20px; margin-top: 30px; }
    
    .btn-call-ctrl {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      display: flex; justify-content: center; align-items: center; color: white; cursor: pointer;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); transition: transform 0.2s;
    }
    .btn-call-ctrl:active { transform: scale(0.9); }
    .btn-call-ctrl.danger { background: var(--danger); }
    .btn-call-ctrl.active { background: var(--accent-primary); }
    .btn-call-ctrl.success { background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 70% { box-shadow: 0 0 0 15px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

    /* MISC */
    #app-toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--bg-surface); border: 1px solid var(--border-strong);
      color: var(--text-main); padding: 10px 20px; border-radius: var(--radius-full);
      font-size: 0.85rem; font-weight: 500; box-shadow: var(--shadow-lg);
      z-index: 9999; opacity: 0; pointer-events: none; transition: all 0.3s var(--ease);
    }
    #app-toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }

    .emoji-picker { display: none; position: absolute; bottom: 80px; left: 16px; right: 16px; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 12px; max-height: 200px; overflow-y: auto; grid-template-columns: repeat(8, 1fr); gap: 6px; box-shadow: var(--shadow-lg); }
    .emoji-picker.active { display: grid; }
    .emoji-picker span { font-size: 1.4rem; cursor: pointer; text-align: center; padding: 4px; border-radius: 6px; }
    .emoji-picker span:active { background: var(--bg-surface-hover); }
    
    .search-result { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); cursor: pointer; text-align: left; }
    .search-result:active { background: var(--bg-surface-hover); }
    .search-result img { width: 44px; height: 44px; border-radius: 50%; }
    
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-light); text-align: left; }
    .settings-row:last-child { border-bottom: none; }
    .toggle { width: 44px; height: 24px; background: var(--bg-surface-hover); border-radius: 12px; position: relative; cursor: pointer; transition: 0.2s; }
    .toggle.active { background: var(--accent-primary); }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.2s; }
    .toggle.active::after { left: 22px; }
  </style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onChildChanged, set, get, update, remove, onValue, onDisconnect, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfAvdE0PZMvytkSaofbFAgk0749E-b_pI",
  authDomain: "trihive-857cd.firebaseapp.com",
  databaseURL: "https://trihive-857cd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "trihive-857cd",
  storageBucket: "trihive-857cd.firebasestorage.app",
  messagingSenderId: "434709340496",
  appId: "1:434709340496:web:3e1206dc10679ddc680c55"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// STATE
let currentUser = localStorage.getItem('trihive_user') || null;
let currentDisplayName = localStorage.getItem('trihive_name') || 'User';
let currentAvatarUrl = localStorage.getItem('trihive_avatar') || 'logo.png';
let contacts = [], unreadCounts = {}, activeContact = null, replyingTo = null, pendingAvatar = null;
let peerConnection = null, localStream = null, isVideoCall = false, currentFacingMode = 'user';
let isIncomingListening = false, targetUser = null, pendingIceCandidates = [];
const unsubscribers = {};

const settings = {
  theme: localStorage.getItem('trihive_theme') || 'dark',
  sound: localStorage.getItem('trihive_sound') !== 'false'
};
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

const $ = id => document.getElementById(id);
const setIcon = (id, symbolId) => { const e = $(id); if (e) e.querySelector('use').setAttribute('href', '#' + symbolId); };

function showToast(msg) {
  const t = $('app-toast'); if (!t) return;
  t.textContent = msg; t.classList.add('active');
  clearTimeout(window.__t); window.__t = setTimeout(() => t.classList.remove('active'), 2500);
}
window.alert = m => showToast(String(m));

function applyTheme() {
  document.documentElement.setAttribute('data-theme', settings.theme);
  $('toggle-theme')?.classList.toggle('active', settings.theme === 'light');
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', settings.theme === 'light' ? '#F1F5F9' : '#0B0F19');
}
window.toggleSetting = key => {
  if (key === 'theme') {
    settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('trihive_theme', settings.theme);
    applyTheme();
  } else {
    settings[key] = !settings[key];
    localStorage.setItem('trihive_' + key, String(settings[key]));
    $('toggle-' + key)?.classList.toggle('active', settings[key]);
  }
};
applyTheme();

// AUDIO
let isAudioUnlocked = false;
function unlockAudio() {
  if (isAudioUnlocked) return;
  ['notif-audio','ring-audio','remote-audio'].forEach(id => {
    const a = $(id); if (a) { const p = a.play(); if (p) p.then(() => { a.pause(); a.currentTime = 0; }).catch(()=>{}); }
  });
  isAudioUnlocked = true;
}
window.addEventListener('click', unlockAudio, { once: true });
window.addEventListener('touchstart', unlockAudio, { once: true });

function playNotif() { if (!settings.sound) return; const a = $('notif-audio'); if (a) { a.currentTime = 0; a.play().catch(()=>{}); } }
function playRing() { if (!settings.sound) return; const a = $('ring-audio'); if (a) { a.currentTime = 0; a.play().catch(()=>{}); } }
function stopRing() { const a = $('ring-audio'); if (a) { a.pause(); a.currentTime = 0; } }

function isUserOnline(d) { return d && (d.isOnline === true || (d.lastSeen && Date.now() - Number(d.lastSeen) < 600000)); }

// GRID
function generateSlots() {
  const slots = [], cr = 6, cc = 6;
  for (let radius = 0; radius < 9; radius++) {
    for (let dr = -radius; dr <= radius; dr++) {
      for (let dc = -radius; dc <= radius; dc++) {
        if (Math.max(Math.abs(dr), Math.abs(dc)) === radius) {
          const r = cr + dr, c = cc + dc;
          if (r >= 0 && r < 14 && c >= 0 && c < 14) slots.push({ r, c });
        }
      }
    }
  }
  return slots;
}
const SLOTS = generateSlots();
let hasDragged = false, panX = 0, panY = 0;

function centerGrid() {
  const canvas = $('canvas'); if (!canvas) return;
  const cx = 150 + (6.5 * 50) + 50, cy = 150 + (6.5 * 58) + 50;
  panX = Math.round((window.innerWidth / 2) - cx);
  panY = Math.round((window.innerHeight / 2) - cy);
  canvas.style.transform = `translate3d(${panX}px, ${panY}px, 0)`;
}

function buildGrid() {
  const grid = $('grid'); if (!grid) return;
  grid.innerHTML = '';
  const map = new Map();
  contacts.slice(0, SLOTS.length).forEach((p, i) => { const s = SLOTS[i]; if (s) map.set(`${s.r}-${s.c}`, p); });

  for (let r = 0; r < 14; r++) {
    const row = document.createElement('div'); row.className = 'grid-row';
    for (let c = 0; c < 14; c++) {
      const upright = (r + c) % 2 === 0;
      const tile = document.createElement('div');
      tile.className = `tile ${upright ? 'tile-upright' : 'tile-inverted'}`;
      tile.style.setProperty('--col-index', c);
      const inner = document.createElement('div'); inner.className = 'tile-inner';
      const person = map.get(`${r}-${c}`);
      
      if (person) {
        const wrap = document.createElement('div'); wrap.className = 'tile-photo-wrapper';
        const img = document.createElement('img'); img.className = 'tile-photo'; img.src = person.avatar || 'logo.png';
        const ov = document.createElement('div'); ov.className = 'tile-photo-overlay';
        const name = document.createElement('div'); name.className = 'tile-name'; name.textContent = person.name;
        wrap.appendChild(img); wrap.appendChild(ov); wrap.appendChild(name);
        
        const unsub = onValue(ref(db, `status/${person.username}`), snap => {
          const ex = wrap.querySelector('.tile-online-dot');
          if (isUserOnline(snap.val())) { if (!ex) { const dot = document.createElement('div'); dot.className = 'tile-online-dot'; wrap.appendChild(dot); } }
          else if (ex) ex.remove();
        });
        unsubscribers['grid_' + person.username] = unsub;
        
        const count = unreadCounts[person.username] || 0;
        if (count > 0) { const b = document.createElement('div'); b.className = 'unread-badge'; b.textContent = count > 99 ? '99+' : count; wrap.appendChild(b); }
        
        inner.appendChild(wrap);
        tile.onclick = () => { if (!hasDragged) window.openProfile(person); };
      } else {
        const bg = document.createElement('div'); bg.className = 'tile-bg'; inner.appendChild(bg);
        tile.onclick = () => { if (!hasDragged && currentUser) window.openAddContactModal(); };
      }
      tile.appendChild(inner); row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}

function initPanning() {
  const vp = $('viewport'), canvas = $('canvas'); if (!vp || !canvas) return;
  centerGrid(); window.addEventListener('resize', centerGrid);
  let down = false, sx = 0, sy = 0, ix = 0, iy = 0;
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('.modal-backdrop') || e.target.closest('header')) return;
    down = true; hasDragged = false; sx = e.clientX; sy = e.clientY; ix = panX; iy = panY;
    try { vp.setPointerCapture(e.pointerId); } catch(_){}
  });
  vp.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) hasDragged = true;
    panX = ix + dx; panY = iy + dy;
    canvas.style.transform = `translate3d(${panX}px, ${panY}px, 0)`;
  });
  const up = e => { if (!down) return; down = false; try { vp.releasePointerCapture(e.pointerId); } catch(_){} };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
}

// AUTH
window.switchTab = tab => {
  $('tab-login')?.classList.toggle('active', tab === 'login');
  $('tab-register')?.classList.toggle('active', tab === 'register');
  $('form-login').style.display = tab === 'login' ? 'block' : 'none';
  $('form-register').style.display = tab === 'register' ? 'block' : 'none';
};

window.handleFileUpload = (event, previewId) => {
  const file = event.target.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) return showToast("Foto max 2MB");
  compressImage(file, 400, 0.8).then(dataUrl => {
    const p = $(previewId); if (p) { p.src = dataUrl; p.style.display = 'block'; }
    pendingAvatar = dataUrl;
  });
};

function compressImage(file, maxW, q) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round((maxW / w) * h); w = maxW; }
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

window.submitLogin = () => {
  unlockAudio();
  const u = $('login-username').value.trim().toLowerCase(), p = $('login-password').value.trim();
  if (!u || !p) return showToast("Isi username & password");
  get(ref(db, `users/${u}`)).then(s => {
    if (s.exists() && s.val().password === p) {
      currentUser = u; currentDisplayName = s.val().displayName || u; currentAvatarUrl = s.val().avatar || 'logo.png';
      localStorage.setItem('trihive_user', currentUser); localStorage.setItem('trihive_name', currentDisplayName); localStorage.setItem('trihive_avatar', currentAvatarUrl);
      setUserLoggedIn(); loadUserContacts(); setupIncomingCallsListener(); showToast(`Halo, ${currentDisplayName}!`);
    } else showToast("Username / password salah");
  });
};

window.submitRegister = () => {
  unlockAudio();
  const u = $('reg-username').value.trim().toLowerCase(), f = $('reg-fullname').value.trim() || u, p = $('reg-password').value.trim();
  if (!u || !p) return showToast("Lengkapi data");
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return showToast("Username 3-20 karakter huruf kecil/angka/_");
  get(ref(db, `users/${u}`)).then(s => {
    if (s.exists()) return showToast("Username dipakai");
    const avatar = pendingAvatar || 'logo.png';
    set(ref(db, `users/${u}`), { username: u, displayName: f, password: p, avatar }).then(() => {
      currentUser = u; currentDisplayName = f; currentAvatarUrl = avatar;
      localStorage.setItem('trihive_user', currentUser); localStorage.setItem('trihive_name', currentDisplayName); localStorage.setItem('trihive_avatar', currentAvatarUrl);
      setUserLoggedIn(); loadUserContacts(); setupIncomingCallsListener(); showToast("Pendaftaran sukses!");
    });
  });
};

function setUserLoggedIn() {
  $('login-modal')?.classList.remove('active');
  $('user-pill').style.display = 'flex'; $('current-user-name').textContent = currentDisplayName; $('current-user-avatar').src = currentAvatarUrl;
  if (!currentUser) return;
  const statusRef = ref(db, `status/${currentUser}`);
  const hb = () => { if (currentUser) update(statusRef, { isOnline: true, lastSeen: Date.now() }); };
  hb(); if (!unsubscribers.heartbeat) unsubscribers.heartbeat = setInterval(hb, 15000);
  onDisconnect(statusRef).update({ isOnline: false, lastSeen: Date.now() });
}

window.logout = () => {
  Object.keys(unsubscribers).forEach(k => { try { const v = unsubscribers[k]; if (typeof v === 'function') v(); else clearInterval(v); } catch(e){} });
  if (currentUser) update(ref(db, `status/${currentUser}`), { isOnline: false });
  localStorage.clear(); location.reload();
};

window.saveProfileChanges = () => {
  const name = $('edit-fullname').value.trim();
  if (!name || !currentUser) return showToast("Nama tidak boleh kosong");
  const newAvatar = pendingAvatar || currentAvatarUrl;
  update(ref(db, `users/${currentUser}`), { displayName: name, avatar: newAvatar }).then(() => {
    currentDisplayName = name; currentAvatarUrl = newAvatar;
    localStorage.setItem('trihive_name', name); localStorage.setItem('trihive_avatar', newAvatar);
    $('current-user-name').textContent = name; $('current-user-avatar').src = newAvatar;
    closeModals(); showToast("Profil diperbarui");
  });
};

// CONTACTS & MESSAGES
function loadUserContacts() {
  if (!currentUser) return;
  if (unsubscribers.contacts) unsubscribers.contacts();
  unsubscribers.contacts = onChildAdded(ref(db, `user_contacts/${currentUser}`), snap => {
    const cUser = snap.key;
    get(ref(db, `users/${cUser}`)).then(c => {
      if (c.exists() && !contacts.find(x => x.username === cUser)) {
        const d = c.val(); contacts.push({ username: d.username, name: d.displayName || d.username, avatar: d.avatar || 'logo.png' });
        buildGrid(); listenIncomingMessages(cUser);
      }
    });
  });
}

function listenIncomingMessages(cUser) {
  if (!currentUser || unsubscribers['msg_' + cUser]) return;
  const roomId = [currentUser, cUser].sort().join('_');
  let isInit = true; setTimeout(() => { isInit = false; }, 1500);
  unsubscribers['msg_' + cUser] = onChildAdded(ref(db, `chats/${roomId}`), snap => {
    const d = snap.val();
    if (d && d.sender === cUser) {
      const isOpen = activeContact?.username === cUser && $('chat-modal').classList.contains('active');
      if (isOpen && !document.hidden) update(ref(db, `chats/${roomId}/${snap.key}`), { unread: false });
      else if (d.unread !== false) { 
        if(!isInit) playNotif(); 
        unreadCounts[cUser] = (unreadCounts[cUser] || 0) + 1; buildGrid(); 
      }
    }
  });
}

window.openAddContactModal = () => { $('add-contact-modal').classList.add('active'); };
window.submitAddContact = () => {
  const u = $('add-contact-username').value.trim().toLowerCase();
  if (!u || u === currentUser) return showToast("Username tidak valid");
  get(ref(db, `users/${u}`)).then(s => {
    if (!s.exists()) return showToast("User tidak ditemukan");
    set(ref(db, `user_contacts/${currentUser}/${u}`), true); set(ref(db, `user_contacts/${u}/${currentUser}`), true);
    closeModals(); showToast("Kontak ditambahkan");
  });
};

window.openSearch = () => {
  if (!currentUser) return showToast("Login dulu");
  $('search-modal').classList.add('active');
  setTimeout(() => $('search-input')?.focus(), 100);
};
window.doSearch = () => {
  const term = $('search-input').value.toLowerCase().trim(), res = $('search-results');
  res.innerHTML = ''; if (!term) return;
  contacts.filter(c => c.username.includes(term) || c.name.toLowerCase().includes(term)).forEach(c => {
    const el = document.createElement('div'); el.className = 'search-result';
    el.innerHTML = `<img src="${c.avatar}"><div><h5></h5><p>@${c.username}</p></div>`;
    el.querySelector('h5').textContent = c.name;
    el.onclick = () => { activeContact = c; closeModals(); setTimeout(openChat, 150); };
    res.appendChild(el);
  });
};

window.openProfile = person => {
  activeContact = person;
  $('preview-name').textContent = person.name; $('preview-username-id').textContent = '@' + person.username; $('preview-avatar').src = person.avatar;
  $('profile-modal').classList.add('active');
};
window.showContactProfile = () => { if (activeContact) window.openProfile(activeContact); };
window.openEditProfileModal = () => { 
  if (currentUser) { 
    $('edit-username-id').textContent = currentUser; $('edit-fullname').value = currentDisplayName;
    $('edit-upload-preview').src = currentAvatarUrl; $('edit-upload-preview').style.display = 'block';
    pendingAvatar = null; $('edit-profile-modal').classList.add('active'); 
  } 
};
window.openSettings = () => { $('settings-modal').classList.add('active'); };
window.closeModals = () => { document.querySelectorAll('.modal-backdrop').forEach(m => { if (m.id !== 'login-modal') m.classList.remove('active'); }); };

// CHAT
let chatAddedUnsub = null, chatChangedUnsub = null, activeChatRoom = null;

window.openChat = () => {
  if (!activeContact || !currentUser) return;
  closeModals(); $('chat-modal').classList.add('active');
  $('chat-name').textContent = activeContact.name; $('chat-avatar').src = activeContact.avatar;
  unreadCounts[activeContact.username] = 0; buildGrid();
  
  const st = $('chat-status');
  if (unsubscribers.chatStatus) unsubscribers.chatStatus();
  unsubscribers.chatStatus = onValue(ref(db, `status/${activeContact.username}`), snap => {
    const d = snap.val();
    if (d && d.isTyping) { st.textContent = 'Sedang mengetik...'; st.style.color = 'var(--accent-primary)'; }
    else if (isUserOnline(d)) { st.textContent = 'Online'; st.style.color = 'var(--success)'; }
    else { st.textContent = 'Offline'; st.style.color = 'var(--text-muted)'; }
  });
  loadMessages();
};

function loadMessages() {
  const body = $('chat-body'), roomId = [currentUser, activeContact.username].sort().join('_');
  if (chatAddedUnsub) chatAddedUnsub();
  if (chatChangedUnsub) chatChangedUnsub();
  if (activeChatRoom !== roomId) { body.innerHTML = ''; activeChatRoom = roomId; }
  
  const q = query(ref(db, `chats/${roomId}`), limitToLast(60));
  chatAddedUnsub = onChildAdded(q, snap => {
    const d = snap.val(); if (!d) return;
    const isMe = d.sender === currentUser;
    if (!isMe && d.unread !== false) update(ref(db, `chats/${roomId}/${snap.key}`), { unread: false });
    renderMessage(snap.key, d, isMe); body.scrollTop = body.scrollHeight;
  });
  chatChangedUnsub = onChildChanged(ref(db, `chats/${roomId}`), snap => {
    const d = snap.val(), el = $('msg-' + snap.key);
    if (el && d && d.sender === currentUser) {
      el.className = `msg msg-out ${d.unread ? '' : 'read'}`;
      const meta = el.querySelector('.msg-meta .ico use');
      if (meta) meta.setAttribute('href', d.unread ? '#i-check' : '#i-check-double');
    }
  });
}

function renderMessage(key, data, isMe) {
  const body = $('chat-body'); if ($('msg-' + key)) return;
  const div = document.createElement('div');
  div.id = 'msg-' + key;
  div.className = `msg ${isMe ? 'msg-out' : 'msg-in'} ${data.unread ? '' : 'read'}`;

  if (data.replyTo) {
    const q = document.createElement('div'); q.className = 'msg-quote';
    q.textContent = '↩ ' + data.replyTo.text; div.appendChild(q);
  }

  if (data.type === 'voice') {
    const c = document.createElement('div'); c.className = 'voice-msg-container';
    const btn = document.createElement('button'); btn.className = 'btn-play-voice';
    btn.innerHTML = '<svg class="ico sm"><use href="#i-play"/></svg>';
    btn.onclick = e => { e.stopPropagation(); playVoice(btn, data.audio); };
    const tag = document.createElement('span'); tag.style.fontSize = '0.85rem'; tag.textContent = 'Pesan Suara';
    c.appendChild(btn); c.appendChild(tag); div.appendChild(c);
  } else if (data.type === 'image') {
    const img = document.createElement('img'); img.className = 'msg-img'; img.src = data.image;
    div.appendChild(img);
  } else {
    const t = document.createElement('div'); t.className = 'msg-text'; t.textContent = data.text || ''; div.appendChild(t);
  }

  const meta = document.createElement('div'); meta.className = 'msg-meta';
  meta.innerHTML = `<span>${data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span>`;
  if (isMe) meta.innerHTML += `<svg class="ico sm"><use href="#${data.unread ? 'i-check' : 'i-check-double'}"/></svg>`;
  
  div.appendChild(meta);
  div.onclick = () => setReply(data.text || 'Media', data.sender);
  body.appendChild(div);
}

window.setReply = (text, sender) => {
  replyingTo = { text, sender };
  $('reply-preview-container').style.display = 'flex';
  $('reply-preview-text').textContent = text.length > 40 ? text.slice(0,40) + '...' : text;
};
window.cancelReply = () => { replyingTo = null; $('reply-preview-container').style.display = 'none'; };
window.handleKey = e => { if (e.key === 'Enter') window.sendMsg(); };

let typingTimer = null;
window.notifyTyping = () => {
  if (!currentUser) return;
  update(ref(db, `status/${currentUser}`), { isTyping: true, lastSeen: Date.now() });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => update(ref(db, `status/${currentUser}`), { isTyping: false }), 2500);
};

window.sendMsg = () => {
  const input = $('chat-input'), text = input.value.trim();
  if (!text || !activeContact) return;
  const roomId = [currentUser, activeContact.username].sort().join('_');
  push(ref(db, `chats/${roomId}`), {
    sender: currentUser, type: 'text', text, unread: true, timestamp: Date.now(),
    replyTo: replyingTo ? { text: replyingTo.text, sender: replyingTo.sender } : null
  });
  input.value = ''; update(ref(db, `status/${currentUser}`), { isTyping: false }); cancelReply();
};

window.sendImageMessage = e => {
  const file = e.target.files[0]; if (!file) return;
  showToast("Memproses gambar...");
  compressImage(file, 800, 0.7).then(dataUrl => {
    const roomId = [currentUser, activeContact.username].sort().join('_');
    push(ref(db, `chats/${roomId}`), {
      sender: currentUser, type: 'image', image: dataUrl, unread: true, timestamp: Date.now(),
      replyTo: replyingTo ? { text: replyingTo.text, sender: replyingTo.sender } : null
    });
    cancelReply();
  });
  e.target.value = '';
};

let mediaRecorder = null, audioChunks = [], recordStart = 0, recordTimer = null;
window.toggleVoiceRecord = async () => {
  const btn = $('btn-mic');
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream); audioChunks = []; recordStart = Date.now();
    mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearTimeout(recordTimer);
      btn.classList.remove('recording'); setIcon('mic-icon', 'i-mic');
      if (Date.now() - recordStart < 800) return showToast("Terlalu pendek");
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        const roomId = [currentUser, activeContact.username].sort().join('_');
        push(ref(db, `chats/${roomId}`), {
          sender: currentUser, type: 'voice', audio: ev.target.result, unread: true, timestamp: Date.now(),
          replyTo: replyingTo ? { text: replyingTo.text, sender: replyingTo.sender } : null
        });
        cancelReply();
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start(); btn.classList.add('recording'); setIcon('mic-icon', 'i-stop'); showToast("Merekam...");
    recordTimer = setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 30000);
  } catch(e) { showToast("Gagal mic"); }
};

window.playVoice = (btn, src) => {
  const a = new Audio(src); a.play();
  btn.innerHTML = '<svg class="ico sm"><use href="#i-pause"/></svg>';
  a.onended = () => btn.innerHTML = '<svg class="ico sm"><use href="#i-play"/></svg>';
};

const EMOJIS = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😋','😛','🤪','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐️','🖖','👋','🤝','🙏','💪','👂','👃','👀','👁️','👅','👄'];

window.toggleEmojiPicker = () => {
  const p = $('emoji-picker');
  if (!p.classList.contains('active')) {
    p.innerHTML = '';
    EMOJIS.forEach(e => {
      const s = document.createElement('span'); s.textContent = e;
      s.onclick = () => { $('chat-input').value += e; };
      p.appendChild(s);
    });
  }
  p.classList.toggle('active');
};

window.deleteChat = () => {
  if (!activeContact || !confirm("Hapus semua pesan?")) return;
  remove(ref(db, `chats/${[currentUser, activeContact.username].sort().join('_')}`));
  $('chat-body').innerHTML = '';
};

window.closeChat = () => {
  if (chatAddedUnsub) chatAddedUnsub();
  if (chatChangedUnsub) chatChangedUnsub();
  if (unsubscribers.chatStatus) unsubscribers.chatStatus();
  closeModals();
};

// WEBRTC & CALLS
function setupIncomingCallsListener() {
  if (!currentUser || isIncomingListening) return;
  isIncomingListening = true;
  unsubscribers.calls = onValue(ref(db, `calls/${currentUser}`), snap => {
    const d = snap.val();
    if (d && d.status === 'calling') {
      targetUser = d.caller; isVideoCall = !!d.isVideo; playRing();
      $('incoming-name').textContent = d.callerName || targetUser; $('incoming-avatar').src = d.callerAvatar || 'logo.png';
      $('incoming-call-type').textContent = isVideoCall ? "Video Call..." : "Voice Call...";
      $('incoming-call-modal').classList.add('active');
    } else if (!d) { stopRing(); $('incoming-call-modal').classList.remove('active'); }
  });
  unsubscribers.answer = onValue(ref(db, `webrtc_signals/${currentUser}/answer`), async snap => {
    const a = snap.val();
    if (a && peerConnection && peerConnection.signalingState === "have-local-offer") {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(a));
      stopRing(); $('call-status-text').textContent = "Terhubung";
    }
  });
  unsubscribers.candidates = onChildAdded(ref(db, `webrtc_signals/${currentUser}/candidates`), async snap => {
    const c = snap.val();
    if (peerConnection && peerConnection.remoteDescription) peerConnection.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
  });
}

async function initMedia(video) {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user' } : false }); }
  catch(e) { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); isVideoCall = false; }
  if (isVideoCall) { $('local-video').srcObject = localStream; $('video-box').style.display = 'block'; $('btn-flip').style.display = 'flex'; }
  else { $('video-box').style.display = 'none'; $('btn-flip').style.display = 'none'; }
  return localStream;
}

function createPC(target) {
  if (peerConnection) peerConnection.close();
  peerConnection = new RTCPeerConnection(rtcConfig);
  if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
  peerConnection.ontrack = e => {
    const stream = e.streams[0];
    if (isVideoCall) { $('remote-video').srcObject = stream; $('video-box').style.display = 'block'; $('remote-video').play().catch(()=>{}); }
    $('remote-audio').srcObject = stream; $('remote-audio').play().catch(()=>{ $('btn-unmute').style.display = 'inline-block'; });
  };
  peerConnection.onicecandidate = e => { if (e.candidate) push(ref(db, `webrtc_signals/${target}/candidates`), e.candidate.toJSON()); };
}

window.startCall = async video => {
  if (!activeContact) return;
  isVideoCall = video; targetUser = activeContact.username;
  await initMedia(video); createPC(targetUser);
  const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
  await set(ref(db, `webrtc_signals/${targetUser}/offer`), { type: offer.type, sdp: offer.sdp });
  await set(ref(db, `calls/${targetUser}`), { caller: currentUser, callerName: currentDisplayName, callerAvatar: currentAvatarUrl, isVideo: video, status: 'calling' });
  playRing(); $('call-name').textContent = activeContact.name; $('call-avatar').src = activeContact.avatar; $('call-status-text').textContent = "Memanggil...";
  $('call-modal').classList.add('active');
};

window.acceptCall = async () => {
  stopRing(); $('incoming-call-modal').classList.remove('active');
  await initMedia(isVideoCall); createPC(targetUser);
  const offer = await get(ref(db, `webrtc_signals/${currentUser}/offer`));
  if (offer.exists()) {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer.val()));
    const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
    await set(ref(db, `webrtc_signals/${targetUser}/answer`), { type: answer.type, sdp: answer.sdp });
  }
  update(ref(db, `calls/${currentUser}`), { status: 'connected' }); update(ref(db, `calls/${targetUser}`), { status: 'connected' });
  $('call-status-text').textContent = "Terhubung"; $('call-modal').classList.add('active');
};

window.rejectCall = () => { stopRing(); if(targetUser) update(ref(db, `calls/${targetUser}`), { status: 'rejected' }); remove(ref(db, `calls/${currentUser}`)); $('incoming-call-modal').classList.remove('active'); };
window.endCall = () => { 
  stopRing(); if (targetUser) remove(ref(db, `calls/${targetUser}`)); remove(ref(db, `calls/${currentUser}`)); 
  if (peerConnection) peerConnection.close(); if (localStream) localStream.getTracks().forEach(t => t.stop());
  $('call-modal').classList.remove('active'); 
};

window.toggleMute = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t) { t.enabled = !t.enabled; $('btn-mute').classList.toggle('active', !t.enabled); setIcon('mute-icon', t.enabled ? 'i-mic' : 'i-mic-off'); }
};
window.toggleVideo = () => {
  if (!localStream) return;
  const t = localStream.getVideoTracks()[0];
  if (t) { t.enabled = !t.enabled; $('btn-video').classList.toggle('active', !t.enabled); setIcon('video-icon', t.enabled ? 'i-video' : 'i-video-off'); }
};
window.switchCamera = async () => {
  if (!isVideoCall || !localStream || !peerConnection) return;
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
    const vTrack = ns.getVideoTracks()[0];
    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) await sender.replaceTrack(vTrack);
    localStream.getVideoTracks().forEach(t => t.stop());
    localStream.getVideoTracks().forEach(t => localStream.removeTrack(t));
    localStream.addTrack(vTrack); $('local-video').srcObject = localStream;
  } catch(e) {}
};
window.forcePlayAudio = () => {
  const a = $('remote-audio'); if (a) a.play().then(() => $('btn-unmute').style.display = 'none').catch(()=>{});
};

// INIT
buildGrid(); initPanning();
if (currentUser) { setUserLoggedIn(); loadUserContacts(); setupIncomingCallsListener(); }
</script>
