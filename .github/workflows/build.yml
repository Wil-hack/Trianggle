name: Build TriHive APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova Global
      run: npm install -g cordova

    - name: Create and Build Android APK
      run: |
        cordova create myApp com.trihive.app TriHive

        cp index.html myApp/www/index.html
        [ -f logo.png ] && cp logo.png myApp/www/logo.png

        if [ ! -f google-services.json ]; then
          echo "google-services.json belum ada di repo!"
          exit 1
        fi
        cp google-services.json myApp/google-services.json

        cd myApp

        cat <<EOT > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.trihive.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>TriHive</name>
            <description>Aplikasi Chat TriHive</description>
            <author email="dev@trihive.com">TriHive Team</author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="BackgroundColor" value="#0b0d12" />
            <preference name="ShowSplashScreen" value="false" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="SplashScreenDelay" value="0" />
            <platform name="android">
                <icon src="www/logo.png" />
                <resource-file src="google-services.json" target="app/google-services.json" />
            </platform>
        </widget>
        EOT

        cordova platform add android

        cordova plugin add cordova-plugin-background-mode || true
        cordova plugin add cordova-plugin-firebasex

        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission and
