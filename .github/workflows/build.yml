name: Build TriHive APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK 11 (Solusi XmlParser)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Cordova Global
      run: npm install -g cordova@12.0.0

    - name: Create and Build Android APK
      run: |
        cordova create myApp com.trihive.app TriHive
        
        if [ -f index.html ]; then
          cp index.html myApp/www/index.html
        fi
        
        if [ -f logo.png ]; then
          cp logo.png myApp/www/logo.png
        fi
        
        cd myApp
        
        # Config.xml Resmi
        cat <<EOT > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.trihive.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>TriHive</name>
            <description>Aplikasi Chat TriHive</description>
            <author email="dev@trihive.com">TriHive Team</author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="BackgroundColor" value="0xff0b0d12" />
            <platform name="android">
                <icon src="www/logo.png" />
            </platform>
        </widget>
        EOT

        cordova platform add android@12.0.1
        
        # Injeksi Izin Android
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' platforms/android/app/src/main/AndroidManifest.xml
        
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TriHive-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
