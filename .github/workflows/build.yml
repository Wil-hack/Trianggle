name: Build TriHive APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - run: npm install -g cordova

    - run: |
        cordova create myApp com.trihive.app TriHive
        cp index.html myApp/www/
        
        if [ -f logo.png ]; then
          cp logo.png myApp/www/logo.png
        fi
        
        cd myApp
        
        # Config.xml resmi Cordova
        cat <<EOT > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.trihive.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>TriHive</name>
            <description>Aplikasi Chat TriHive</description>
            <author email="dev@trihive.com">TriHive Team</author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="BackgroundColor" value="0xff0b0d12" />
            <preference name="SplashScreen" value="screen" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="SplashScreenDelay" value="2000" />
            <platform name="android">
                <icon src="www/logo.png" />
                <splash src="www/logo.png" />
            </platform>
        </widget>
        EOT

        cordova platform add android
        
        # Plugin Utama & Plugin Notifikasi Sistem (WhatsApp Style)
        cordova plugin add cordova-plugin-media
        cordova plugin add cordova-plugin-android-permissions
        cordova plugin add cordova-plugin-splashscreen
        cordova plugin add cordova-plugin-local-notification
        
        # Pemasangan Ikon Aplikasi
        if [ -f www/logo.png ]; then
          mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-mdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xhdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
          
          cp www/logo.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp www/logo.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp www/logo.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
        fi

        # Latar Belakang Splash Screen Gelap
        mkdir -p platforms/android/app/src/main/res/values
        cat <<EOT > platforms/android/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="cdv_splashscreen_background">#0b0d12</color>
        </resources>
        EOT

        # Injeksi Izin Android Termasuk Notifikasi & Vibrate & Record Audio
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' platforms/android/app/src/main/AndroidManifest.xml
        
        cordova build android --debug

    - uses: actions/upload-artifact@v4
      with:
        name: TriHive-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
