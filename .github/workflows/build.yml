name: Build TriHive APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Cordova Global
        run: npm install -g cordova

      - name: Create and Build Android APK
        run: |
          cordova create myApp com.trihive.app TriHive

          cp index.html myApp/www/index.html
          if [ -f logo.png ]; then cp logo.png myApp/www/logo.png; fi

          if [ ! -f google-services.json ]; then
            echo "google-services.json belum ada di repo!"
            exit 1
          fi
          cp google-services.json myApp/google-services.json

          cd myApp

          cat <<EOT > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.trihive.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>TriHive</name>
              <description>Aplikasi Chat TriHive</description>
              <author email="dev@trihive.com">TriHive Team</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="BackgroundColor" value="#0b0d12" />
              <preference name="ShowSplashScreen" value="false" />
              <preference name="AutoHideSplashScreen" value="true" />
              <preference name="SplashScreenDelay" value="0" />
              <platform name="android">
                  <icon src="www/logo.png" />
                  <resource-file src="google-services.json" target="app/google-services.json" />
              </platform>
          </widget>
          EOT

          cordova platform add android

          cordova plugin add cordova-plugin-background-mode || true
          cordova plugin add cordova-plugin-firebasex

          MANIFEST=platforms/android/app/src/main/AndroidManifest.xml
          for P in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS INTERNET WAKE_LOCK VIBRATE RECEIVE_BOOT_COMPLETED FOREGROUND_SERVICE FOREGROUND_SERVICE_DATA_SYNC POST_NOTIFICATIONS SYSTEM_ALERT_WINDOW USE_FULL_SCREEN_INTENT REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            if ! grep -q "android.permission.$P\"" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
            fi
          done

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriHive-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
